<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Homestead Helper Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col">

  <div class="flex-1 p-6 space-y-4" id="chat"></div>

  <div class="p-4 border-t flex gap-2">
    <input
      id="userInput"
      class="flex-1 border rounded px-3 py-2"
      placeholder="Tell me what's happening..."
    />
    <button
      onclick="sendMessage()"
      class="bg-amber-400 px-4 py-2 rounded"
    >
      Send
    </button>
  </div>

  <script>
    const API_KEY = "YOUR_GEMINI_API_KEY";
    const MODEL = "gemini-1.5-flash";

    function addMessage(text, role = "assistant") {
      const chat = document.getElementById("chat");
      const bubble = document.createElement("div");
      bubble.className =
        role === "user"
          ? "ml-auto bg-rose-300 p-3 rounded-lg max-w-md"
          : "mr-auto bg-amber-200 p-3 rounded-lg max-w-md";
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [
                {
                  role: "user",
                  parts: [{ text: message }]
                }
              ]
            })
          }
        );
