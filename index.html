<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homestead Helper Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap');
    :root { --cream: #FFF8E7; --brown: #8B6F47; --mint: #B5E7D3; }
    body { font-family: 'Josefin Sans', sans-serif; background: var(--cream); margin: 0; }
    .chat-container { height: 100vh; display: flex; flex-direction: column; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 12px; }
    .bubble { border: 2.5px solid var(--brown); border-radius: 18px; padding: 12px; max-width: 85%; line-height: 1.4; }
    .user { align-self: flex-end; background: var(--mint); }
    .assistant { align-self: flex-start; background: white; }
    .status-indicator { font-size: 10px; font-weight: bold; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    // Direct import of Gemini SDK
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const config = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    // Initialize Firebase
    if (!firebase.apps.length) firebase.initializeApp(config);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function HomesteadApp() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [dbStatus, setDbStatus] = useState('Connecting...');
      const scrollRef = useRef(null);

      useEffect(() => {
        const unsub = db.collection('messages').orderBy('timestamp', 'asc').limit(50)
          .onSnapshot(snap => {
            setMessages(snap.docs.map(doc => doc.data()));
            setDbStatus('Online');
          }, err => setDbStatus('DB Connection Error'));
        return () => unsub();
      }, []);

      useEffect(() => { scrollRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const sendMessage = async () => {
        if (!input.trim() || loading) return;
        const prompt = input;
        setInput('');
        setLoading(true);

        try {
          const genAI = new GoogleGenerativeAI(config.apiKey);
          const model = genAI.getGenerativeModel({ 
            model: "gemini-1.5-flash",
            systemInstruction: "You are the Homestead Assistant for Mike's family in Airville, PA. You know about Ruth the sheep, bees, and the garden. You are practical and friendly."
          });

          // 1. Save to Firebase
          await db.collection('messages').add({ role: 'user', content: prompt, timestamp: Date.now() });
          
          // 2. Call Gemini
          const result = await model.generateContent(prompt);
          const responseText = result.response.text();

          // 3. Save AI Response to Firebase
          await db.collection('messages').add({ role: 'assistant', content: responseText, timestamp: Date.now() });
        } catch (e) {
          console.error("CRITICAL AI ERROR:", e);
          alert("AI Failed: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      return h('div', { className: 'chat-container' },
        h('header', { className: 'p-4 bg-orange-200 border-b-4 border-amber-900 flex justify-between items-center' },
          h('h1', { className: 'text-xl font-bold text-amber-900' }, '🏡 Homestead Helper'),
          h('span', { 
            className: 'status-indicator', 
            style: { color: dbStatus === 'Online' ? '#4A7C59' : '#9B5D6B' } 
          }, dbStatus)
        ),
        h('div', { className: 'messages-container' },
          messages.map((m, i) => h('div', { key: i, className: `bubble ${m.role}` }, m.content)),
          loading && h('div', { className: 'assistant bubble' }, 'Thinking...'),
          h('div', { ref: scrollRef })
        ),
        h('div', { className: 'p-4 bg-white border-t-2 border-amber-900 flex gap-2' },
          h('input', {
            value: input,
            onChange: e => setInput(e.target.value),
            onKeyPress: e => e.key === 'Enter' && sendMessage(),
            className: 'flex-1 p-3 border-2 border-amber-100 rounded-xl outline-none focus:border-amber-400',
            placeholder: 'How is Ruth doing?'
          }),
          h('button', { 
            onClick: sendMessage, 
            className: 'bg-amber-800 text-white px-6 py-2 rounded-xl font-bold active:scale-95 transition-transform' 
          }, 'Send')
        )
      );
    }

    // MODERN REACT 18 STARTUP
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(HomesteadApp));
  </script>
</body>
</html>
