<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homestead">
  <meta name="theme-color" content="#fb923c">
  <title>Homestead Helper Pro</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23fb923c' width='100' height='100'/%3E%3Ctext y='75' font-size='70' text-anchor='middle' x='50'%3E🏡%3C/text%3E%3C/svg%3E">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    body {
      overscroll-behavior-y: contain;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    .chat-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    
    .slide-panel {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100vh;
      transition: right 0.3s ease;
      z-index: 100;
    }
    
    .slide-panel.open {
      right: 0;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .recording-indicator {
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    .voice-wave {
      display: inline-block;
      width: 4px;
      height: 20px;
      margin: 0 2px;
      background: #f97316;
      animation: wave 1s ease-in-out infinite;
    }
    
    .voice-wave:nth-child(1) { animation-delay: 0s; }
    .voice-wave:nth-child(2) { animation-delay: 0.1s; }
    .voice-wave:nth-child(3) { animation-delay: 0.2s; }
    .voice-wave:nth-child(4) { animation-delay: 0.3s; }
    .voice-wave:nth-child(5) { animation-delay: 0.4s; }
    
    @keyframes wave {
      0%, 100% { height: 10px; }
      50% { height: 30px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const { useState, useEffect, useRef, createElement: h } = React;

    function HomesteadHelperPro() {
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [isAISpeaking, setIsAISpeaking] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [showOrganized, setShowOrganized] = useState(false);
      const [tasks, setTasks] = useState({});
      const [photos, setPhotos] = useState({});
      const [profile, setProfile] = useState(null);
      const [weather, setWeather] = useState(null);
      const [currentLocation, setCurrentLocation] = useState(null);
      const [isDark, setIsDark] = useState(true);
      
      const messagesEndRef = useRef(null);
      const recognitionRef = useRef(null);
      const speechSynthRef = useRef(null);
      const fileInputRef = useRef(null);

      const modules = [
        { id: 'garden', name: 'Garden', emoji: '🌱' },
        { id: 'greenhouse', name: 'Greenhouse', emoji: '🏡' },
        { id: 'orchard', name: 'Fruit & Orchard', emoji: '🍎' },
        { id: 'bees', name: 'Beekeeping', emoji: '🐝' },
        { id: 'livestock', name: 'Sheep & Goats', emoji: '🐑' },
        { id: 'birds', name: 'Birds', emoji: '🐓' },
        { id: 'farmstand', name: 'Farm Stand', emoji: '🏪' },
        { id: 'property', name: 'Property', emoji: '🔧' },
        { id: 'household', name: 'Household', emoji: '🏠' }
      ];

      // Initialize
      useEffect(() => {
        loadData();
        initSpeechRecognition();
        initSpeechSynthesis();
        requestLocation();
        
        // Load initial greeting
        const hasGreeted = localStorage.getItem('hasGreeted');
        if (!hasGreeted) {
          setTimeout(() => {
            const greeting = "Hi! I'm your homestead assistant. Tell me what's happening on your farm today, and I'll help organize everything. You can type or use the microphone button to speak!";
            addMessage('assistant', greeting);
            speak(greeting);
            localStorage.setItem('hasGreeted', 'true');
          }, 1000);
        }
      }, []);

      // Sync messages with Firebase
      useEffect(() => {
        const unsubscribe = db.collection('homesteads').doc('family').collection('messages')
          .orderBy('timestamp', 'asc')
          .onSnapshot((snapshot) => {
            const msgs = [];
            snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
            if (msgs.length > 0) setMessages(msgs);
          });

        return () => unsubscribe();
      }, []);

      // Sync tasks
      useEffect(() => {
        const unsubscribe = db.collection('homesteads').doc('family').collection('tasks')
          .onSnapshot((snapshot) => {
            const tasksData = {};
            snapshot.forEach(doc => tasksData[doc.id] = doc.data().items || []);
            setTasks(tasksData);
          });

        return () => unsubscribe();
      }, []);

      // Sync photos
      useEffect(() => {
        const unsubscribe = db.collection('homesteads').doc('family').collection('photos')
          .onSnapshot((snapshot) => {
            const photosData = {};
            snapshot.forEach(doc => photosData[doc.id] = doc.data().items || []);
            setPhotos(photosData);
          });

        return () => unsubscribe();
      }, []);

      // Load profile and weather
      useEffect(() => {
        db.collection('homesteads').doc('family').onSnapshot(doc => {
          if (doc.exists) {
            if (doc.data().profile) setProfile(doc.data().profile);
          }
        });
      }, []);

      // Auto-scroll messages
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      async function loadData() {
        try {
          const doc = await db.collection('homesteads').doc('family').get();
          if (doc.exists && doc.data().profile) {
            setProfile(doc.data().profile);
          }
        } catch (e) {
          console.error('Load error:', e);
        }
      }

      async function requestLocation() {
        if (!navigator.geolocation) return;
        
        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject);
          });
          
          const loc = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };
          setCurrentLocation(loc);
          loadWeather(loc);
        } catch (e) {
          console.error('Location error:', e);
        }
      }

      async function loadWeather(location) {
        if (!location) return;
        
        try {
          const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`
          );
          const data = await response.json();
          setWeather(data);
        } catch (e) {
          console.error('Weather error:', e);
        }
      }

      function initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window)) return;
        
        const recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        
        recognition.onresult = (event) => {
          let interimTranscript = '';
          let finalTranscript = '';
          
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalTranscript += transcript + ' ';
            } else {
              interimTranscript += transcript;
            }
          }
          
          setInputText(finalTranscript + interimTranscript);
        };
        
        recognition.onerror = (event) => {
          console.error('Speech recognition error:', event.error);
          setIsRecording(false);
        };
        
        recognition.onend = () => {
          setIsRecording(false);
        };
        
        recognitionRef.current = recognition;
      }

      function initSpeechSynthesis() {
        speechSynthRef.current = window.speechSynthesis;
      }

      function toggleRecording() {
        if (!recognitionRef.current) {
          alert('Voice recognition not supported on this device');
          return;
        }
        
        if (isRecording) {
          recognitionRef.current.stop();
          setIsRecording(false);
        } else {
          recognitionRef.current.start();
          setIsRecording(true);
        }
      }

      function speak(text) {
        if (!speechSynthRef.current) return;
        
        // Cancel any ongoing speech
        speechSynthRef.current.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        
        utterance.onstart = () => setIsAISpeaking(true);
        utterance.onend = () => setIsAISpeaking(false);
        
        speechSynthRef.current.speak(utterance);
      }

      function stopSpeaking() {
        if (speechSynthRef.current) {
          speechSynthRef.current.cancel();
          setIsAISpeaking(false);
        }
      }

      async function addMessage(role, content, metadata = {}) {
        const message = {
          role,
          content,
          timestamp: Date.now(),
          ...metadata
        };
        
        try {
          await db.collection('homesteads').doc('family').collection('messages').add(message);
        } catch (e) {
          console.error('Message save error:', e);
          setMessages(prev => [...prev, message]);
        }
      }

      async function sendMessage() {
        if (!inputText.trim() && !isRecording) return;
        
        const userMessage = inputText.trim();
        setInputText('');
        
        if (isRecording) {
          recognitionRef.current.stop();
          setIsRecording(false);
        }
        
        if (!userMessage) return;
        
        // Add user message
        await addMessage('user', userMessage);
        
        // Get AI response
        setIsLoading(true);
        await getAIResponse(userMessage);
        setIsLoading(false);
      }

      async function getAIResponse(userMessage) {
        try {
          // Build context
          let systemContext = `You are a helpful homestead assistant. You help organize tasks, track inventory, identify problems, and give advice about farming, animals, crops, and homesteading.

IMPORTANT INSTRUCTIONS:
1. Extract actionable tasks from user messages and remember them
2. Track inventory mentions (eggs collected, feed used, etc.)
3. Identify problems and create tasks to address them
4. Be conversational and friendly
5. Ask follow-up questions when needed
6. Give practical, specific advice
7. Keep responses concise but helpful (2-3 sentences usually)`;

          if (profile) {
            systemContext += `\n\nHomestead Profile:
- Location: ${profile.location}
- Zone: ${profile.zone}
- Animals: ${profile.animals}
- Crops: ${profile.crops}`;
          }

          if (weather) {
            systemContext += `\n\nCurrent Weather: ${Math.round(weather.current.temperature_2m)}°F`;
          }

          // Get recent conversation history
          const recentMessages = messages.slice(-10).map(m => ({
            role: m.role,
            content: m.content
          }));
          
          recentMessages.push({ role: 'user', content: userMessage });

          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 500,
              system: systemContext,
              messages: recentMessages
            })
          });

          const data = await response.json();
          const aiResponse = data.content[0].text;
          
          // Add AI message
          await addMessage('assistant', aiResponse);
          
          // Speak the response
          speak(aiResponse);
          
          // Extract and create tasks automatically
          await extractAndCreateTasks(userMessage, aiResponse);
          
        } catch (e) {
          console.error('AI error:', e);
          const errorMsg = "Sorry, I'm having trouble connecting. Please try again.";
          await addMessage('assistant', errorMsg);
          speak(errorMsg);
        }
      }

      async function extractAndCreateTasks(userMsg, aiMsg) {
        // Simple task extraction - look for keywords
        const taskKeywords = ['need to', 'should', 'must', 'have to', 'fix', 'check', 'water', 'feed', 'collect', 'monitor'];
        const combined = userMsg.toLowerCase() + ' ' + aiMsg.toLowerCase();
        
        // Check each module for relevant mentions
        for (const module of modules) {
          const moduleName = module.name.toLowerCase();
          const moduleKeywords = [moduleName, module.id];
          
          // If message mentions this module and has task keywords
          const mentionsModule = moduleKeywords.some(kw => combined.includes(kw));
          const hasTasks = taskKeywords.some(kw => combined.includes(kw));
          
          if (mentionsModule && hasTasks) {
            // Extract potential task
            const sentences = (userMsg + ' ' + aiMsg).split(/[.!?]/);
            for (const sentence of sentences) {
              const lower = sentence.toLowerCase();
              if (moduleKeywords.some(kw => lower.includes(kw)) && 
                  taskKeywords.some(kw => lower.includes(kw))) {
                
                const task = {
                  id: Date.now() + Math.random(),
                  text: sentence.trim(),
                  completed: false,
                  created: new Date().toISOString(),
                  extractedFrom: 'chat'
                };
                
                const moduleTasks = tasks[module.id] || [];
                const updatedTasks = [...moduleTasks, task];
                
                await db.collection('homesteads').doc('family').collection('tasks')
                  .doc(module.id).set({ items: updatedTasks });
                
                break; // Only create one task per module per message
              }
            }
          }
        }
      }

      async function handlePhotoUpload(file) {
        const reader = new FileReader();
        reader.onload = async (e) => {
          const photoData = e.target.result;
          
          // Add as user message with photo
          await addMessage('user', '[Photo uploaded]', { hasPhoto: true, photoData });
          
          // Analyze with AI
          setIsLoading(true);
          try {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 800,
                messages: [{
                  role: 'user',
                  content: [
                    {
                      type: 'image',
                      source: {
                        type: 'base64',
                        media_type: 'image/jpeg',
                        data: photoData.split(',')[1]
                      }
                    },
                    {
                      type: 'text',
                      text: 'Analyze this photo from my homestead. What do you see? Is there anything concerning? What should I do?'
                    }
                  ]
                }]
              })
            });

            const data = await response.json();
            const analysis = data.content[0].text;
            
            await addMessage('assistant', analysis, { isPhotoAnalysis: true });
            speak(analysis);
            
          } catch (e) {
            console.error('Photo analysis error:', e);
          }
          setIsLoading(false);
        };
        reader.readAsDataURL(file);
      }

      // Render
      return h('div', { className: `chat-container ${isDark ? 'bg-slate-950' : 'bg-orange-50'}` },
        // Header
        h('header', { className: `p-4 border-b ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-orange-200'}` },
          h('div', { className: 'flex items-center justify-between' },
            h('div', { className: 'flex items-center gap-3' },
              h('div', { className: 'text-2xl' }, '🏡'),
              h('div', null,
                h('h1', { className: `text-lg font-bold ${isDark ? 'text-orange-400' : 'text-orange-900'}` }, 'Homestead Helper'),
                weather && h('p', { className: `text-xs ${isDark ? 'text-slate-400' : 'text-orange-700'}` },
                  `${Math.round(weather.current.temperature_2m)}°F`
                )
              )
            ),
            h('div', { className: 'flex items-center gap-2' },
              h('button', {
                onClick: () => setShowOrganized(true),
                className: `p-2 rounded-lg ${isDark ? 'bg-slate-800 text-slate-300' : 'bg-orange-200 text-orange-900'}`,
                title: 'View Organized'
              }, '📊'),
              h('button', {
                onClick: () => setIsDark(!isDark),
                className: `p-2 rounded-lg ${isDark ? 'bg-slate-800 text-yellow-400' : 'bg-orange-200 text-orange-900'}`
              }, isDark ? '☀️' : '🌙')
            )
          )
        ),

        // Messages
        h('div', { className: 'messages-container' },
          messages.map((msg, i) =>
            h('div', {
              key: msg.id || i,
              className: `mb-4 ${msg.role === 'user' ? 'text-right' : 'text-left'}`
            },
              h('div', {
                className: `inline-block max-w-[85%] p-3 rounded-2xl ${
                  msg.role === 'user'
                    ? 'bg-orange-600 text-white'
                    : isDark ? 'bg-slate-800 text-slate-200' : 'bg-white text-slate-900 shadow'
                }`
              },
                msg.hasPhoto && h('div', { className: 'mb-2' },
                  h('img', { src: msg.photoData, className: 'max-w-full rounded-lg', alt: 'Photo' })
                ),
                h('p', { className: 'whitespace-pre-wrap' }, msg.content),
                msg.isPhotoAnalysis && h('span', { className: 'text-xs opacity-75' }, ' 📸')
              ),
              msg.role === 'assistant' && i === messages.length - 1 && isAISpeaking &&
                h('div', { className: 'mt-1 text-xs text-orange-400' }, '🔊 Speaking...')
            )
          ),
          
          isLoading && h('div', { className: 'text-left mb-4' },
            h('div', { className: `inline-block p-3 rounded-2xl ${isDark ? 'bg-slate-800' : 'bg-white shadow'}` },
              h('div', { className: 'flex gap-1' },
                h('span', { className: 'voice-wave' }),
                h('span', { className: 'voice-wave' }),
                h('span', { className: 'voice-wave' }),
                h('span', { className: 'voice-wave' }),
                h('span', { className: 'voice-wave' })
              )
            )
          ),
          
          h('div', { ref: messagesEndRef })
        ),

        // Input Area
        h('div', { className: `p-4 border-t ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-orange-200'}` },
          isRecording && h('div', { className: 'mb-2 text-center' },
            h('div', { className: `inline-flex items-center gap-2 px-3 py-1 rounded-full ${isDark ? 'bg-red-900/50' : 'bg-red-100'}` },
              h('div', { className: `w-2 h-2 rounded-full bg-red-500 recording-indicator` }),
              h('span', { className: `text-sm ${isDark ? 'text-red-300' : 'text-red-700'}` }, 'Recording...')
            )
          ),
          
          h('div', { className: 'flex items-end gap-2' },
            h('button', {
              onClick: () => fileInputRef.current?.click(),
              className: `p-3 rounded-full ${isDark ? 'bg-slate-800 text-blue-400' : 'bg-blue-100 text-blue-600'}`,
              title: 'Upload photo'
            }, '📷'),
            
            h('input', {
              ref: fileInputRef,
              type: 'file',
              accept: 'image/*',
              capture: 'environment',
              className: 'hidden',
              onChange: (e) => {
                if (e.target.files?.[0]) {
                  handlePhotoUpload(e.target.files[0]);
                  e.target.value = '';
                }
              }
            }),
            
            h('div', { className: 'flex-1' },
              h('textarea', {
                value: inputText,
                onChange: (e) => setInputText(e.target.value),
                onKeyPress: (e) => {
                  if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                  }
                },
                placeholder: isRecording ? 'Listening...' : 'Type or speak...',
                rows: 1,
                className: `w-full px-4 py-3 rounded-2xl resize-none ${
                  isDark 
                    ? 'bg-slate-800 text-white placeholder-slate-500 border-2 border-slate-700' 
                    : 'bg-gray-100 text-slate-900 placeholder-slate-400 border-2 border-gray-200'
                }`,
                disabled: isRecording
              })
            ),
            
            h('button', {
              onClick: toggleRecording,
              className: `p-3 rounded-full transition-all ${
                isRecording 
                  ? 'bg-red-600 text-white animate-pulse'
                  : isDark ? 'bg-slate-800 text-orange-400' : 'bg-orange-200 text-orange-900'
              }`,
              title: isRecording ? 'Stop recording' : 'Start recording'
            }, isRecording ? '⏹️' : '🎤'),
            
            h('button', {
              onClick: sendMessage,
              disabled: !inputText.trim() || isLoading,
              className: `p-3 rounded-full transition-all ${
                inputText.trim() && !isLoading
                  ? 'bg-orange-600 text-white hover:bg-orange-500'
                  : isDark ? 'bg-slate-800 text-slate-600' : 'bg-gray-200 text-gray-400'
              }`
            }, '➤')
          ),
          
          isAISpeaking && h('button', {
            onClick: stopSpeaking,
            className: 'mt-2 w-full py-2 bg-orange-600 text-white rounded-lg text-sm'
          }, '🔇 Stop Speaking')
        ),

        // Organized View Panel (Slide from right)
        h('div', { className: `slide-panel ${showOrganized ? 'open' : ''} ${isDark ? 'bg-slate-950' : 'bg-orange-50'}` },
          h('div', { className: `h-full flex flex-col border-l ${isDark ? 'border-slate-800' : 'border-orange-200'}` },
            h('div', { className: `p-4 border-b flex items-center justify-between ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-orange-200'}` },
              h('h2', { className: `text-lg font-bold ${isDark ? 'text-white' : 'text-slate-900'}` }, '📊 Organized View'),
              h('button', {
                onClick: () => setShowOrganized(false),
                className: `px-3 py-1 rounded-lg ${isDark ? 'bg-slate-800 text-slate-300' : 'bg-orange-200 text-orange-900'}`
              }, '✕')
            ),
            
            h('div', { className: 'flex-1 overflow-y-auto p-4' },
              // Tasks by Module
              h('div', { className: 'mb-6' },
                h('h3', { className: `text-lg font-semibold mb-3 ${isDark ? 'text-white' : 'text-slate-900'}` }, 'Tasks by Module'),
                h('div', { className: 'space-y-3' },
                  ...modules.map(module => {
                    const moduleTasks = tasks[module.id] || [];
                    const pending = moduleTasks.filter(t => !t.completed);
                    if (pending.length === 0) return null;
                    
                    return h('div', {
                      key: module.id,
                      className: `p-4 rounded-xl ${isDark ? 'bg-slate-800' : 'bg-white shadow'}`
                    },
                      h('div', { className: 'flex items-center gap-2 mb-2' },
                        h('span', { className: 'text-xl' }, module.emoji),
                        h('h4', { className: `font-semibold ${isDark ? 'text-white' : 'text-slate-900'}` }, module.name),
                        h('span', { className: `ml-auto px-2 py-1 rounded text-xs ${isDark ? 'bg-orange-900/30 text-orange-300' : 'bg-orange-100 text-orange-700'}` },
                          pending.length
                        )
                      ),
                      h('ul', { className: 'space-y-1' },
                        ...pending.slice(0, 3).map(task =>
                          h('li', {
                            key: task.id,
                            className: `text-sm ${isDark ? 'text-slate-300' : 'text-slate-700'}`
                          }, `• ${task.text}`)
                        )
                      ),
                      pending.length > 3 && h('p', { className: `text-xs mt-2 ${isDark ? 'text-slate-500' : 'text-slate-500'}` },
                        `+${pending.length - 3} more tasks`
                      )
                    );
                  }).filter(Boolean)
                )
              ),
              
              // Recent Photos
              Object.keys(photos).length > 0 && h('div', null,
                h('h3', { className: `text-lg font-semibold mb-3 ${isDark ? 'text-white' : 'text-slate-900'}` }, 'Recent Photos'),
                h('div', { className: 'grid grid-cols-2 gap-2' },
                  ...Object.values(photos).flat().slice(-6).map((photo, i) =>
                    h('img', {
                      key: i,
                      src: photo.data,
                      className: 'w-full h-32 object-cover rounded-lg',
                      alt: 'Homestead photo'
                    })
                  )
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.render(
      React.createElement(HomesteadHelperPro),
      document.getElementById('root')
    );

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered'))
          .catch(err => console.log('SW failed'));
      });
    }
  </script>
</body>
</html>
