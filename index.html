<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homestead Helper Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&family=Josefin+Sans:wght@300;400;600;700&display=swap');
    :root { --cream: #FFF8E7; --peach: #FFB4A2; --brown: #8B6F47; --mint: #B5E7D3; }
    body { font-family: 'Josefin Sans', sans-serif; background: var(--cream); margin: 0; overflow: hidden; }
    .chat-container { height: 100vh; display: flex; flex-direction: column; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 12px; }
    .message-bubble { border: 2.5px solid var(--brown); border-radius: 20px; padding: 15px; max-width: 85%; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
    .user { align-self: flex-end; background: var(--peach); color: var(--brown); }
    .assistant { align-self: flex-start; background: white; color: #4A5568; }
    .folk-header { border-bottom: 4px solid var(--brown); background: linear-gradient(to right, var(--peach), #E5989B, var(--peach)); }
    .slide-panel { position: fixed; top: 0; right: -100%; width: 85%; height: 100%; background: var(--cream); z-index: 50; transition: 0.3s; border-left: 4px solid var(--brown); }
    .slide-panel.open { right: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    const config = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    firebase.initializeApp(config);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [showPanel, setShowPanel] = useState(false);
      const [error, setError] = useState(null);
      const scrollRef = useRef(null);

      useEffect(() => {
        return db.collection('homesteads').doc('family').collection('messages')
          .orderBy('timestamp', 'asc').limit(50)
          .onSnapshot(snap => setMessages(snap.docs.map(d => ({id: d.id, ...d.data()}))));
      }, []);

      useEffect(() => { scrollRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const sendMessage = async () => {
        if (!input.trim() || loading) return;
        const prompt = input;
        setInput('');
        setLoading(true);
        setError(null);

        try {
          // 1. Log to DB
          await db.collection('homesteads').doc('family').collection('messages').add({
            role: 'user', content: prompt, timestamp: Date.now()
          });

          // 2. Direct Fetch Handshake (No SDK dependency)
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${config.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: `You are the Homestead Assistant for Mike's family in Airville, PA. You know Ruth (sheep), chickens, ducks, peafowl, and Tobias (limp). Be direct. Prompt: ${prompt}` }]
              }]
            })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error.message);
          
          const aiText = data.candidates[0].content.parts[0].text;

          // 3. Log Result
          await db.collection('homesteads').doc('family').collection('messages').add({
            role: 'assistant', content: aiText, timestamp: Date.now()
          });
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      return h('div', { className: 'chat-container' },
        h('header', { className: 'folk-header p-4 flex justify-between items-center' },
          h('h1', { className: 'text-xl font-bold text-amber-900', style: { fontFamily: "'Crimson Text', serif" } }, '🏡 Homestead Helper Pro'),
          h('button', { onClick: () => setShowPanel(true), className: 'bg-white px-3 py-1 rounded-lg text-xs font-bold border-2 border-amber-900' }, 'MENU')
        ),
        
        h('div', { className: 'messages-container' },
          error && h('div', { className: 'bg-red-100 p-2 text-xs text-red-700 border-2 border-red-700 rounded mb-4' }, `⚠️ ${error}`),
          messages.map((m, i) => h('div', { key: i, className: `message-bubble ${m.role}` }, m.content)),
          loading && h('div', { className: 'assistant message-bubble' }, 'Thinking...'),
          h('div', { ref: scrollRef })
        ),

        h('div', { className: 'p-4 bg-white border-t-4 border-amber-900 flex gap-2' },
          h('input', {
            value: input, onChange: e => setInput(e.target.value),
            onKeyPress: e => e.key === 'Enter' && sendMessage(),
            className: 'flex-1 p-3 border-2 border-amber-100 rounded-xl outline-none focus:border-amber-400',
            placeholder: 'How is Ruth?'
          }),
          h('button', { onClick: sendMessage, className: 'bg-amber-800 text-white px-6 py-2 rounded-xl font-bold' }, 'Send')
        ),

        // Side Panel
        h('div', { className: `slide-panel p-6 ${showPanel ? 'open' : ''}` },
          h('div', { className: 'flex justify-between items-center mb-6' },
            h('h2', { className: 'text-2xl font-bold text-amber-900' }, 'Homestead Modules'),
            h('button', { onClick: () => setShowPanel(false), className: 'text-2xl' }, '✕')
          ),
          ['Livestock (Ruth/Tobias)', 'Poultry (Ducks/Peafowl)', 'Garden & Weather', 'Beekeeping'].map(m => 
            h('div', { key: m, className: 'p-4 border-2 border-amber-800 rounded-xl bg-orange-50 font-bold mb-3' }, m)
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>
