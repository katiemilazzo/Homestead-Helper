<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homestead">
  <meta name="theme-color" content="#FFB4A2">
  <title>Homestead Helper Pro</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FFB4A2' width='100' height='100'/%3E%3Ctext y='75' font-size='70' text-anchor='middle' x='50'%3E🏡%3C/text%3E%3C/svg%3E">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Josefin+Sans:wght@300;400;600;700&display=swap');
    
    :root {
      --folk-cream: #FFF8E7;
      --folk-peach: #FFB4A2;
      --folk-coral: #E5989B;
      --folk-terracotta: #D68A7F;
      --folk-mint: #B5E7D3;
      --folk-sage: #8FB996;
      --folk-lavender: #C9B8E4;
      --folk-butter: #FFE5B4;
      --folk-brown: #8B6F47;
      --folk-navy: #4A5568;
      --folk-burgundy: #9B5D6B;
      --folk-sky: #A8DADC;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Josefin Sans', sans-serif;
      background: var(--folk-cream);
      overscroll-behavior-y: contain;
    }
    
    .chat-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, var(--folk-cream) 0%, var(--folk-butter) 50%, var(--folk-cream) 100%);
    }
    
    .messages-container {
      flex: 1;
      overflow-y-auto;
      padding: 1.5rem;
      position: relative;
    }
    
    .messages-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        var(--folk-brown) 0px,
        var(--folk-brown) 10px,
        transparent 10px,
        transparent 20px
      );
      opacity: 0.1;
      pointer-events: none;
    }
    
    .slide-panel {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100vh;
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      background: var(--folk-cream);
      border-left: 4px solid var(--folk-brown);
    }
    
    .slide-panel.open {
      right: 0;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    
    .recording-indicator {
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    .voice-wave {
      display: inline-block;
      width: 5px;
      height: 20px;
      margin: 0 3px;
      background: linear-gradient(to top, var(--folk-coral), var(--folk-peach));
      border-radius: 10px;
      animation: wave 1.2s ease-in-out infinite;
    }
    
    .voice-wave:nth-child(1) { animation-delay: 0s; height: 15px; }
    .voice-wave:nth-child(2) { animation-delay: 0.15s; height: 25px; }
    .voice-wave:nth-child(3) { animation-delay: 0.3s; height: 35px; }
    .voice-wave:nth-child(4) { animation-delay: 0.45s; height: 25px; }
    .voice-wave:nth-child(5) { animation-delay: 0.6s; height: 15px; }
    
    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.5); }
    }

    .folk-card {
      border: 3px solid var(--folk-brown);
      border-radius: 16px;
      box-shadow: 5px 5px 0 rgba(139, 111, 71, 0.25);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .folk-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 rgba(139, 111, 71, 0.25);
    }

    .folk-button {
      border: 2.5px solid currentColor;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 12px;
      position: relative;
    }

    .folk-button:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 3px 3px 0 currentColor;
    }

    .folk-button:active:not(:disabled) {
      transform: translate(0, 0);
      box-shadow: 1px 1px 0 currentColor;
    }

    .message-bubble {
      border: 2.5px solid;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      position: relative;
    }

    .message-bubble::after {
      content: '';
      position: absolute;
      bottom: -2px;
      width: 20px;
      height: 20px;
      border: 2.5px solid;
      border-color: inherit;
      background: inherit;
    }

    .message-bubble.user::after {
      right: -8px;
      border-radius: 0 0 20px 0;
      border-top: none;
      border-left: none;
    }

    .message-bubble.assistant::after {
      left: -8px;
      border-radius: 0 0 0 20px;
      border-top: none;
      border-right: none;
    }

    .folk-header {
      border-bottom: 4px solid var(--folk-brown);
      background: linear-gradient(to right, var(--folk-peach), var(--folk-coral), var(--folk-peach));
      position: relative;
    }

    .folk-header::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 4px;
      background: repeating-linear-gradient(
        90deg,
        var(--folk-brown) 0px,
        var(--folk-brown) 10px,
        transparent 10px,
        transparent 20px
      );
    }

    .decorative-corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2.5px solid var(--folk-brown);
    }

    .decorative-corner.top-left {
      top: 10px;
      left: 10px;
      border-right: none;
      border-bottom: none;
      border-radius: 8px 0 0 0;
    }

    .decorative-corner.top-right {
      top: 10px;
      right: 10px;
      border-left: none;
      border-bottom: none;
      border-radius: 0 8px 0 0;
    }

    .folk-badge {
      background: var(--folk-burgundy);
      color: white;
      border: 2px solid var(--folk-brown);
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 2px 2px 0 rgba(139, 111, 71, 0.3);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function HomesteadHelperPro() {
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [isAISpeaking, setIsAISpeaking] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [showOrganized, setShowOrganized] = useState(false);
      const [showGeofences, setShowGeofences] = useState(false);
      const [tasks, setTasks] = useState({});
      const [photos, setPhotos] = useState({});
      const [profile, setProfile] = useState(null);
      const [weather, setWeather] = useState(null);
      const [currentLocation, setCurrentLocation] = useState(null);
      const [geofences, setGeofences] = useState([]);
      const [activeReminders, setActiveReminders] = useState([]);
      const [availableVoices, setAvailableVoices] = useState([]);
      const [selectedVoice, setSelectedVoice] = useState(null);
      const [showVoiceSelector, setShowVoiceSelector] = useState(false);
      const [voiceEnabled, setVoiceEnabled] = useState(false);
      
      const messagesEndRef = useRef(null);
      const recognitionRef = useRef(null);
      const speechSynthRef = useRef(null);
      const fileInputRef = useRef(null);
      const locationWatchId = useRef(null);

      const modules = [
        { id: 'garden', name: 'Garden', emoji: '🌱', color: '#8FB996' },
        { id: 'greenhouse', name: 'Greenhouse', emoji: '🏡', color: '#B5E7D3' },
        { id: 'orchard', name: 'Fruit & Orchard', emoji: '🍎', color: '#E5989B' },
        { id: 'bees', name: 'Beekeeping', emoji: '🐝', color: '#FFE5B4' },
        { id: 'livestock', name: 'Sheep & Goats', emoji: '🐑', color: '#C9B8E4' },
        { id: 'birds', name: 'Birds', emoji: '🐓', color: '#FFB4A2' },
        { id: 'farmstand', name: 'Farm Stand', emoji: '🏪', color: '#8FB996' },
        { id: 'property', name: 'Property', emoji: '🔧', color: '#D68A7F' },
        { id: 'household', name: 'Household', emoji: '🏠', color: '#9B5D6B' }
      ];

      const defaultGeofences = [
        {
          id: 'farmstand',
          name: 'Farm Stand',
          moduleId: 'farmstand',
          latitude: 0,
          longitude: 0,
          radius: 50,
          emoji: '🏪',
          enabled: true,
          reminders: ['Check cash box', 'Restock sold items', 'Collect money']
        },
        {
          id: 'coop',
          name: 'Chicken Coop',
          moduleId: 'birds',
          latitude: 0,
          longitude: 0,
          radius: 30,
          emoji: '🐓',
          enabled: true,
          reminders: ['Collect eggs', 'Check water', 'Count chickens']
        },
        {
          id: 'barn',
          name: 'Barn',
          moduleId: 'livestock',
          latitude: 0,
          longitude: 0,
          radius: 40,
          emoji: '🐑',
          enabled: true,
          reminders: ['Check animals', 'Feed livestock', 'Look for any issues']
        }
      ];

      useEffect(() => {
        loadData();
        initSpeechRecognition();
        initSpeechSynthesis();
        requestLocation();
        
        // Load voice preference
        const savedVoiceEnabled = localStorage.getItem('voiceEnabled');
        if (savedVoiceEnabled === 'true') {
          setVoiceEnabled(true);
        }
        
        const hasGreeted = localStorage.getItem('hasGreeted');
        if (!hasGreeted) {
          setTimeout(() => {
            const greeting = "Welcome to your homestead! Tell me what's happening on the farm today, and I'll help you keep track of everything. You can type or tap the microphone to speak!";
            addMessage('assistant', greeting);
            speak(greeting);
            localStorage.setItem('hasGreeted', 'true');
          }, 1000);
        }
      }, []);

      useEffect(() => {
        const unsubscribe = db.collection('homesteads').doc('family').collection('messages')
          .orderBy('timestamp', 'asc')
          .onSnapshot((snapshot) => {
            const msgs = [];
            snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
            if (msgs.length > 0) setMessages(msgs);
          });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const unsubscribe = db.collection('homesteads').doc('family').collection('tasks')
          .onSnapshot((snapshot) => {
            const tasksData = {};
            snapshot.forEach(doc => tasksData[doc.id] = doc.data().items || []);
            setTasks(tasksData);
          });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const unsubscribe = db.collection('homesteads').doc('family').collection('photos')
          .onSnapshot((snapshot) => {
            const photosData = {};
            snapshot.forEach(doc => photosData[doc.id] = doc.data().items || []);
            setPhotos(photosData);
          });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        db.collection('homesteads').doc('family').onSnapshot(doc => {
          if (doc.exists) {
            if (doc.data().profile) setProfile(doc.data().profile);
            if (doc.data().geofences) setGeofences(doc.data().geofences);
            else setGeofences(defaultGeofences);
          } else {
            setGeofences(defaultGeofences);
          }
        });
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      async function loadData() {
        try {
          const doc = await db.collection('homesteads').doc('family').get();
          if (doc.exists && doc.data().profile) {
            setProfile(doc.data().profile);
          }
        } catch (e) {
          console.error('Load error:', e);
        }
      }

      async function requestLocation() {
        if (!navigator.geolocation) return;
        
        try {
          if ('Notification' in window && Notification.permission === 'default') {
            await Notification.requestPermission();
          }

          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject);
          });
          
          const loc = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };
          setCurrentLocation(loc);
          loadWeather(loc);
          startLocationTracking();
        } catch (e) {
          console.error('Location error:', e);
        }
      }

      function startLocationTracking() {
        if (locationWatchId.current) return;
        
        locationWatchId.current = navigator.geolocation.watchPosition(
          (position) => {
            const newLoc = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude
            };
            setCurrentLocation(newLoc);
            checkGeofences(newLoc);
          },
          (error) => console.log('Location error:', error),
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
        );
      }

      async function loadWeather(location) {
        if (!location) return;
        
        try {
          const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`
          );
          const data = await response.json();
          setWeather(data);
        } catch (e) {
          console.error('Weather error:', e);
        }
      }

      function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
      }

      function checkGeofences(location) {
        geofences.forEach(geofence => {
          if (!geofence.enabled || geofence.latitude === 0) return;
          
          const distance = calculateDistance(
            location.latitude,
            location.longitude,
            geofence.latitude,
            geofence.longitude
          );

          if (distance <= geofence.radius) {
            const lastReminder = localStorage.getItem(`geofence-${geofence.id}-last`);
            const now = Date.now();
            const cooldown = 30 * 60 * 1000;
            
            if (!lastReminder || (now - parseInt(lastReminder)) > cooldown) {
              triggerGeofenceReminder(geofence);
              localStorage.setItem(`geofence-${geofence.id}-last`, now.toString());
            }
          }
        });
      }

      function triggerGeofenceReminder(geofence) {
        const moduleTasks = tasks[geofence.moduleId] || [];
        const pendingTasks = moduleTasks.filter(t => !t.completed);
        
        const reminders = [
          ...geofence.reminders,
          ...pendingTasks.slice(0, 2).map(t => `Task: ${t.text}`)
        ];

        setActiveReminders(reminders);

        if ('Notification' in window && Notification.permission === 'granted') {
          const notification = new Notification(`${geofence.emoji} You're near ${geofence.name}!`, {
            body: reminders[0],
            tag: `geofence-${geofence.id}`
          });

          notification.onclick = () => window.focus();
        }

        const reminderMsg = `Hey! I noticed you're near the ${geofence.name}. Here's what you might want to check: ${reminders.slice(0, 2).join(', ')}`;
        addMessage('assistant', reminderMsg);
        speak(reminderMsg);
      }

      async function setGeofenceAtCurrentLocation(name, emoji, moduleId) {
        if (!currentLocation) {
          alert('Location not available. Please enable location access.');
          return;
        }

        const newGeofence = {
          id: `custom-${Date.now()}`,
          name,
          moduleId,
          latitude: currentLocation.latitude,
          longitude: currentLocation.longitude,
          radius: 40,
          emoji,
          enabled: true,
          reminders: [`Check ${name}`, 'Review any pending tasks']
        };

        const updatedGeofences = geofences.map(g => 
          g.name === name ? newGeofence : g
        );

        if (!geofences.find(g => g.name === name)) {
          updatedGeofences.push(newGeofence);
        }

        try {
          await db.collection('homesteads').doc('family').set({
            geofences: updatedGeofences
          }, { merge: true });
          
          alert(`Geofence set for ${name}! You'll get reminders when you're within 40 meters.`);
        } catch (e) {
          console.error('Error saving geofence:', e);
        }
      }

      useEffect(() => {
        return () => {
          if (locationWatchId.current) {
            navigator.geolocation.clearWatch(locationWatchId.current);
          }
        };
      }, []);

      function initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window)) return;
        
        const recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        
        recognition.onresult = (event) => {
          let interimTranscript = '';
          let finalTranscript = '';
          
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalTranscript += transcript + ' ';
            } else {
              interimTranscript += transcript;
            }
          }
          
          setInputText(finalTranscript + interimTranscript);
        };
        
        recognition.onerror = (event) => {
          console.error('Speech recognition error:', event.error);
          setIsRecording(false);
        };
        
        recognition.onend = () => {
          setIsRecording(false);
        };
        
        recognitionRef.current = recognition;
      }

      function initSpeechSynthesis() {
        speechSynthRef.current = window.speechSynthesis;
        
        // Load voices
        const loadVoices = () => {
          const voices = speechSynthRef.current.getVoices();
          setAvailableVoices(voices);
          
          // Try to select a good default voice
          const savedVoice = localStorage.getItem('preferredVoice');
          if (savedVoice) {
            const voice = voices.find(v => v.name === savedVoice);
            if (voice) setSelectedVoice(voice);
          } else {
            // Default to first English voice that sounds natural
            const goodVoice = voices.find(v => 
              v.lang.startsWith('en') && 
              (v.name.includes('Natural') || v.name.includes('Enhanced') || v.name.includes('Premium') || v.name.includes('Google'))
            ) || voices.find(v => v.lang.startsWith('en')) || voices[0];
            
            setSelectedVoice(goodVoice);
          }
        };
        
        // Load voices immediately
        loadVoices();
        
        // Voices might load async on some browsers
        if (speechSynthRef.current.onvoiceschanged !== undefined) {
          speechSynthRef.current.onvoiceschanged = loadVoices;
        }
      }

      function toggleRecording() {
        if (!recognitionRef.current) {
          alert('Voice recognition not supported on this device');
          return;
        }
        
        if (isRecording) {
          recognitionRef.current.stop();
          setIsRecording(false);
        } else {
          recognitionRef.current.start();
          setIsRecording(true);
        }
      }

      function speak(text) {
        if (!speechSynthRef.current || !voiceEnabled) return;
        
        speechSynthRef.current.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        
        // Use selected voice if available
        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }
        
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        
        utterance.onstart = () => setIsAISpeaking(true);
        utterance.onend = () => setIsAISpeaking(false);
        
        speechSynthRef.current.speak(utterance);
      }

      function changeVoice(voice) {
        setSelectedVoice(voice);
        setVoiceEnabled(true); // Enable voice when user selects one
        localStorage.setItem('preferredVoice', voice.name);
        localStorage.setItem('voiceEnabled', 'true');
        
        // Test the voice
        const testUtterance = new SpeechSynthesisUtterance("Hello! This is how I'll sound.");
        testUtterance.voice = voice;
        speechSynthRef.current.speak(testUtterance);
      }

      function toggleVoice() {
        const newState = !voiceEnabled;
        setVoiceEnabled(newState);
        localStorage.setItem('voiceEnabled', newState.toString());
        
        if (newState && !selectedVoice && availableVoices.length > 0) {
          // If enabling voice for first time, open selector
          setShowVoiceSelector(true);
        }
      }

      function stopSpeaking() {
        if (speechSynthRef.current) {
          speechSynthRef.current.cancel();
          setIsAISpeaking(false);
        }
      }

      async function addMessage(role, content, metadata = {}) {
        const message = {
          role,
          content,
          timestamp: Date.now(),
          ...metadata
        };
        
        try {
          await db.collection('homesteads').doc('family').collection('messages').add(message);
        } catch (e) {
          console.error('Message save error:', e);
          setMessages(prev => [...prev, message]);
        }
      }

      async function sendMessage() {
        if (!inputText.trim() && !isRecording) return;
        
        const userMessage = inputText.trim();
        setInputText('');
        
        if (isRecording) {
          recognitionRef.current.stop();
          setIsRecording(false);
        }
        
        if (!userMessage) return;
        
        const lowerMsg = userMessage.toLowerCase();
        if (lowerMsg.includes('set geofence') || lowerMsg.includes('geofence here') || lowerMsg.includes('location reminder')) {
          let foundGeofence = null;
          geofences.forEach(gf => {
            if (lowerMsg.includes(gf.name.toLowerCase()) || lowerMsg.includes(gf.moduleId)) {
              foundGeofence = gf;
            }
          });

          if (foundGeofence) {
            await setGeofenceAtCurrentLocation(foundGeofence.name, foundGeofence.emoji, foundGeofence.moduleId);
            const response = `Great! I've set a geofence for ${foundGeofence.name}. You'll get reminders when you're within ${foundGeofence.radius} meters next time!`;
            await addMessage('user', userMessage);
            await addMessage('assistant', response);
            speak(response);
            return;
          }
        }
        
        await addMessage('user', userMessage);
        
        setIsLoading(true);
        await getAIResponse(userMessage);
        setIsLoading(false);
      }

      async function getAIResponse(userMessage) {
        try {
          let systemContext = `You are a helpful homestead assistant. You help organize tasks, track inventory, identify problems, and give advice about farming, animals, crops, and homesteading.

IMPORTANT INSTRUCTIONS:
1. Extract actionable tasks from user messages and remember them
2. Track inventory mentions (eggs collected, feed used, etc.)
3. Identify problems and create tasks to address them
4. Be conversational and friendly
5. Ask follow-up questions when needed
6. Give practical, specific advice
7. Keep responses concise but helpful (2-3 sentences usually)
8. When user says "set geofence" or similar, acknowledge you'll remind them when they return to that location

GEOFENCING: If user mentions setting a geofence or location reminder, respond positively and tell them the system will remind them when they're near that location next time.`;

          if (profile) {
            systemContext += `\n\nHomestead Profile:
- Location: ${profile.location}
- Zone: ${profile.zone}
- Animals: ${profile.animals}
- Crops: ${profile.crops}`;
          }

          if (weather) {
            systemContext += `\n\nCurrent Weather: ${Math.round(weather.current.temperature_2m)}°F`;
          }

          const recentMessages = messages.slice(-6).map(m => 
            `${m.role === 'user' ? 'User' : 'Assistant'}: ${m.content}`
          ).join('\n\n');

          const fullPrompt = `${systemContext}\n\nConversation so far:\n${recentMessages}\n\nUser: ${userMessage}\n\nAssistant:`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=AIzaSyDUopZFlAK3b3xxkbAdF_ofsqAoPK0HPm4`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: fullPrompt
                }]
              }],
              generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 500
              }
            })
          });

          if (!response.ok) {
            throw new Error(`API returned ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();
          
          // Better error handling for Gemini response
          if (!data.candidates || data.candidates.length === 0) {
            throw new Error('No response from AI');
          }
          
          const aiResponse = data.candidates[0].content.parts[0].text;
          
          await addMessage('assistant', aiResponse);
          speak(aiResponse);
          await extractAndCreateTasks(userMessage, aiResponse);
          
        } catch (e) {
          console.error('AI error:', e);
          console.error('Full error details:', e.message);
          const errorMsg = "Sorry, I had trouble connecting. Please try again in a moment.";
          await addMessage('assistant', errorMsg);
          speak(errorMsg);
        }
      }

      async function extractAndCreateTasks(userMsg, aiMsg) {
        const taskKeywords = ['need to', 'should', 'must', 'have to', 'fix', 'check', 'water', 'feed', 'collect', 'monitor'];
        const combined = userMsg.toLowerCase() + ' ' + aiMsg.toLowerCase();
        
        for (const module of modules) {
          const moduleName = module.name.toLowerCase();
          const moduleKeywords = [moduleName, module.id];
          
          const mentionsModule = moduleKeywords.some(kw => combined.includes(kw));
          const hasTasks = taskKeywords.some(kw => combined.includes(kw));
          
          if (mentionsModule && hasTasks) {
            const sentences = (userMsg + ' ' + aiMsg).split(/[.!?]/);
            for (const sentence of sentences) {
              const lower = sentence.toLowerCase();
              if (moduleKeywords.some(kw => lower.includes(kw)) && 
                  taskKeywords.some(kw => lower.includes(kw))) {
                
                const task = {
                  id: Date.now() + Math.random(),
                  text: sentence.trim(),
                  completed: false,
                  created: new Date().toISOString(),
                  extractedFrom: 'chat'
                };
                
                const moduleTasks = tasks[module.id] || [];
                const updatedTasks = [...moduleTasks, task];
                
                await db.collection('homesteads').doc('family').collection('tasks')
                  .doc(module.id).set({ items: updatedTasks });
                
                break;
              }
            }
          }
        }
      }

          setIsLoading(true);
          try {
            const base64Data = photoData.split(',')[1];
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=AIzaSyDUopZFlAK3b3xxkbAdF_ofsqAoPK0HPm4`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    {
                      text: 'Analyze this photo from my homestead. What do you see? Is there anything concerning? What should I do? Be specific and practical.'
                    },
                    {
                      inline_data: {
                        mime_type: 'image/jpeg',
                        data: base64Data
                      }
                    }
                  ]
                }],
                generationConfig: {
                  temperature: 0.4,
                  maxOutputTokens: 800
                }
              })
            });

            if (!response.ok) {
              throw new Error(`API returned ${response.status}`);
            }

            const data = await response.json();
            
            if (!data.candidates || data.candidates.length === 0) {
              throw new Error('No response from AI for photo');
            }
            
            const analysis = data.candidates[0].content.parts[0].text;
            
            await addMessage('assistant', analysis, { isPhotoAnalysis: true });
            speak(analysis);
            
          } catch (e) {
            console.error('Photo analysis error:', e);
            const errorMsg = "Sorry, I couldn't analyze that photo. Please try again.";
            await addMessage('assistant', errorMsg);
          }
          setIsLoading(false);
        };
        reader.readAsDataURL(file);

        showVoiceSelector && h('div', { className: 'fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4' },
          h('div', { 
            className: 'w-full max-w-md folk-card overflow-hidden',
            style: { 
              maxHeight: '70vh',
              background: 'linear-gradient(135deg, #FFF8E7, #FFE5B4)'
            }
          },
            h('div', { 
              className: 'p-4 flex items-center justify-between',
              style: { 
                background: 'linear-gradient(to right, #FFE5B4, #FFB4A2)',
                borderBottom: '3px solid #8B6F47'
              }
            },
              h('h2', { 
                className: 'text-xl font-bold',
                style: { fontFamily: "'Crimson Text', serif", color: '#8B6F47' }
              }, '🎤 Choose Voice'),
              h('button', {
                onClick: () => setShowVoiceSelector(false),
                className: 'folk-button px-4 py-2',
                style: {
                  background: '#E5989B',
                  color: '#8B6F47',
                  borderColor: '#8B6F47'
                }
              }, 'Close')
            ),
            
            h('div', { className: 'p-4 overflow-y-auto', style: { maxHeight: 'calc(70vh - 80px)' } },
              h('p', { 
                className: 'mb-4 text-sm',
                style: { color: '#9B5D6B', fontWeight: 500 }
              }, 'Try different voices! Some sound much better than others. Click to test, then close to save.'),
              
              selectedVoice && h('div', { 
                className: 'mb-4 p-3 rounded-xl',
                style: { background: '#B5E7D3', border: '2.5px solid #8B6F47' }
              },
                h('p', { 
                  className: 'text-sm font-semibold',
                  style: { color: '#8B6F47' }
                }, `Current: ${selectedVoice.name}`),
                h('p', { 
                  className: 'text-xs mt-1',
                  style: { color: '#4A5568' }
                }, `Language: ${selectedVoice.lang}`)
              ),
              
              h('div', { className: 'space-y-2' },
                ...availableVoices.map((voice, i) => {
                  const isSelected = selectedVoice && selectedVoice.name === voice.name;
                  const isEnglish = voice.lang.startsWith('en');
                  
                  return h('button', {
                    key: i,
                    onClick: () => changeVoice(voice),
                    className: 'w-full text-left p-3 rounded-xl folk-button transition-all',
                    style: isSelected ? {
                      background: '#8FB996',
                      color: '#FFF8E7',
                      borderColor: '#8B6F47'
                    } : {
                      background: isEnglish ? '#FFF8E7' : '#E5E5E5',
                      color: '#4A5568',
                      borderColor: '#8B6F47'
                    }
                  },
                    h('div', { className: 'flex items-center justify-between' },
                      h('div', null,
                        h('p', { 
                          className: 'font-semibold text-sm',
                          style: { fontFamily: "'Josefin Sans', sans-serif" }
                        }, voice.name),
                        h('p', { className: 'text-xs opacity-75' }, 
                          `${voice.lang} ${voice.localService ? '(Local)' : '(Online)'}`
                        )
                      ),
                      isSelected && h('span', null, '✓')
                    )
                  );
                })
              ),
              
              availableVoices.length === 0 && h('div', { 
                className: 'p-4 text-center',
                style: { color: '#9B5D6B' }
              },
                h('p', null, 'Loading voices...')
              )
            )
          )
        )
      );
    }

    ReactDOM.render(
      React.createElement(HomesteadHelperPro),
      document.getElementById('root')
    );

    // Service worker disabled - not needed for GitHub Pages

    //       .then(reg => console.log('SW registered'))
    //       .catch(err => console.log('SW failed'));
    //   });
    // }
  </script>
</body>
