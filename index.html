<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homestead">
  <meta name="theme-color" content="#FFB4A2">
  <title>Homestead Helper Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Josefin+Sans:wght@300;400;600;700&display=swap');
    
    :root {
      --folk-cream: #FFF8E7;
      --folk-peach: #FFB4A2;
      --folk-coral: #E5989B;
      --folk-mint: #B5E7D3;
      --folk-butter: #FFE5B4;
      --folk-brown: #8B6F47;
      --folk-burgundy: #9B5D6B;
    }

    body {
      font-family: 'Josefin Sans', sans-serif;
      background: var(--folk-cream);
      margin: 0;
      overscroll-behavior-y: contain;
    }
    
    .chat-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, var(--folk-cream) 0%, var(--folk-butter) 50%, var(--folk-cream) 100%);
    }
    
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }
    
    .message-bubble {
      border: 2.5px solid var(--folk-brown);
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1rem;
      max-width: 85%;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
    }

    .message-bubble.user {
      background: linear-gradient(135deg, #FFB4A2, #E5989B);
      color: #8B6F47;
      align-self: flex-end;
      margin-left: auto;
    }

    .message-bubble.assistant {
      background: linear-gradient(135deg, #FFF8E7, #FFE5B4);
      color: #4A5568;
      align-self: flex-start;
    }

    .folk-header {
      border-bottom: 4px solid var(--folk-brown);
      background: linear-gradient(to right, var(--folk-peach), var(--folk-coral), var(--folk-peach));
    }

    .folk-button {
      border: 2.5px solid var(--folk-brown);
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .folk-button:active {
      transform: translate(1px, 1px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function HomesteadHelperPro() {
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        const unsubscribe = db.collection('homesteads').doc('family').collection('messages')
          .orderBy('timestamp', 'asc')
          .onSnapshot((snapshot) => {
            const msgs = [];
            snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
            setMessages(msgs);
          });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      async function sendMessage() {
        if (!inputText.trim() || isLoading) return;
        
        const userMessage = inputText.trim();
        setInputText('');
        setIsLoading(true);

        const messageData = {
          role: 'user',
          content: userMessage,
          timestamp: Date.now()
        };

        try {
          await db.collection('homesteads').doc('family').collection('messages').add(messageData);

          const systemContext = `You are a helpful homestead assistant for a family in Airville, PA.
          You assist with Ruth the sheep, the chickens, ducks, and peafowl.
          Give practical, warm advice and track tasks. Keep responses concise.`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${firebaseConfig.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `${systemContext}\n\nUser: ${userMessage}` }] }]
            })
          });

          const data = await response.json();
          const aiResponse = data.candidates[0].content.parts[0].text;

          await db.collection('homesteads').doc('family').collection('messages').add({
            role: 'assistant',
            content: aiResponse,
            timestamp: Date.now()
          });
        } catch (e) {
          console.error('Error:', e);
        } finally {
          setIsLoading(false);
        }
      }

      return h('div', { className: 'chat-container' },
        h('header', { className: 'folk-header p-4' },
          h('h1', { className: 'text-2xl font-bold text-center', style: { color: '#8B6F47', fontFamily: "'Crimson Text', serif" } }, 'Homestead Helper Pro')
        ),
        h('div', { className: 'messages-container flex flex-col' },
          messages.map((msg, i) => 
            h('div', { key: i, className: `message-bubble ${msg.role}` }, msg.content)
          ),
          h('div', { ref: messagesEndRef })
        ),
        h('div', { className: 'p-4 border-t-4 border-amber-900 bg-white' },
          h('div', { className: 'flex gap-2 max-w-4xl mx-auto' },
            h('input', {
              value: inputText,
              onChange: (e) => setInputText(e.target.value),
              onKeyPress: (e) => e.key === 'Enter' && sendMessage(),
              className: 'flex-1 p-3 border-2 border-amber-800 rounded-xl outline-none',
              placeholder: 'Tell me about the farm...'
            }),
            h('button', {
              onClick: sendMessage,
              disabled: isLoading,
              className: 'folk-button bg-amber-800 text-white px-6 py-2'
            }, isLoading ? '...' : '➤')
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(HomesteadHelperPro));
  </script>
</body>
</html>
