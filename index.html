<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homestead">
  <meta name="theme-color" content="#fb923c">
  <title>Homestead Helper</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23fb923c' width='100' height='100'/%3E%3Ctext y='75' font-size='70' text-anchor='middle' x='50'%3E🏡%3C/text%3E%3C/svg%3E">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Prevent pull-to-refresh on mobile */
    body {
      overscroll-behavior-y: contain;
    }
    
    /* Hide scrollbar but keep functionality */
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(251, 146, 60, 0.3);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(251, 146, 60, 0.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import HomesteadHelper from './homestead-helper-geofence.js';
    
    const { useState, useEffect } = React;
    
    // Polyfill for storage API (in case it's not available)
    if (!window.storage) {
      window.storage = {
        async get(key) {
          const value = localStorage.getItem(key);
          return value ? { key, value, shared: false } : null;
        },
        async set(key, value) {
          localStorage.setItem(key, value);
          return { key, value, shared: false };
        },
        async delete(key) {
          localStorage.removeItem(key);
          return { key, deleted: true, shared: false };
        },
        async list(prefix) {
          const keys = Object.keys(localStorage).filter(k => 
            !prefix || k.startsWith(prefix)
          );
          return { keys, prefix, shared: false };
        }
      };
    }
    
    // Main App Wrapper
    function App() {
      const [isInstalled, setIsInstalled] = useState(false);
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      
      useEffect(() => {
        // Check if app is installed
        if (window.matchMedia('(display-mode: standalone)').matches) {
          setIsInstalled(true);
        }
        
        // Listen for install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        });
        
        // Handle URL parameters for Siri shortcuts
        const params = new URLSearchParams(window.location.search);
        const action = params.get('action');
        
        if (action) {
          setTimeout(() => {
            if (action === 'assistant') {
              // Open assistant
              document.querySelector('[data-action="open-agent"]')?.click();
            }
          }, 1000);
        }
      }, []);
      
      const handleInstall = async () => {
        if (!deferredPrompt) return;
        
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        
        if (outcome === 'accepted') {
          setDeferredPrompt(null);
          setIsInstalled(true);
        }
      };
      
      return (
        <>
          <HomesteadHelper />
          
          {!isInstalled && deferredPrompt && (
            <div className="fixed bottom-4 left-4 right-4 bg-orange-600 text-white p-4 rounded-2xl shadow-2xl z-50 flex items-center justify-between">
              <div>
                <p className="font-bold">Install Homestead Helper</p>
                <p className="text-sm opacity-90">Add to home screen for offline access</p>
              </div>
              <button
                onClick={handleInstall}
                className="bg-white text-orange-600 px-4 py-2 rounded-lg font-medium hover:bg-orange-50"
              >
                Install
              </button>
            </div>
          )}
        </>
      );
    }
    
    // Render app
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  
  <!-- Initialize service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => console.log('SW registered'))
          .catch(err => console.log('SW registration failed'));
      });
    }
  </script>
</body>
</html>
