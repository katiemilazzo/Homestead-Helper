<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homestead Helper Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Josefin Sans', sans-serif; background: #FFF8E7; }
    .bubble { border: 2px solid #8B6F47; border-radius: 15px; padding: 10px; margin-bottom: 10px; max-width: 80%; }
    .user { align-self: flex-end; background: #B5E7D3; margin-left: auto; }
    .assistant { align-self: flex-start; background: white; }
    .diagnostic { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 15px; border-radius: 10px; margin: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const config = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    firebase.initializeApp(config);
    const db = firebase.firestore();
    const { useState, useEffect, createElement: h } = React;

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [error, setError] = useState(null);

      useEffect(() => {
        const unsub = db.collection('messages').orderBy('timestamp', 'asc').onSnapshot(
          s => setMessages(s.docs.map(d => d.data())),
          e => setError("DATABASE ERROR: " + e.message)
        );
        return () => unsub();
      }, []);

      const send = async () => {
        try {
          const genAI = new GoogleGenerativeAI(config.apiKey);
          const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
          
          await db.collection('messages').add({ role: 'user', content: input, timestamp: Date.now() });
          const tempInput = input;
          setInput('');

          const res = await model.generateContent(tempInput);
          await db.collection('messages').add({ role: 'assistant', content: res.response.text(), timestamp: Date.now() });
        } catch (e) {
          setError("AI ERROR: " + e.message);
        }
      };

      return h('div', { className: 'flex flex-col h-screen' },
        h('header', { className: 'p-4 bg-orange-200 border-b-4 border-amber-900 font-bold text-center' }, '🏡 Homestead Helper Diagnostics'),
        error && h('div', { className: 'diagnostic' }, 
          h('p', { className: 'font-bold underline mb-2' }, 'System Failure Detected:'),
          h('p', null, error)
        ),
        h('div', { className: 'flex-1 overflow-y-auto p-4 flex flex-col' },
          messages.map((m, i) => h('div', { key: i, className: `bubble ${m.role}` }, m.content))
        ),
        h('div', { className: 'p-4 bg-white border-t-2 border-amber-900 flex gap-2' },
          h('input', { value: input, onChange: e => setInput(e.target.value), className: 'flex-1 border p-2 rounded' }),
          h('button', { onClick: send, className: 'bg-amber-800 text-white px-4 py-2 rounded' }, 'Send')
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>
