  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",

      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9",
      measurementId: "G-NZX2TPDB0L"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // IFTTT Configuration - Replace with your webhook key
    const IFTTT_WEBHOOK_KEY = 'YOUR_IFTTT_KEY_HERE'; // Get this from ifttt.com/maker_webhooks

    // Main App
    const { useState, useEffect, useRef, createElement: h } = React;

    function HomesteadHelperPro() {
      const [modules, setModules] = useState([]);
      const [selectedModule, setSelectedModule] = useState(null);
      const [tasks, setTasks] = useState({});
      const [photos, setPhotos] = useState({});
      const [showAgent, setShowAgent] = useState(false);
      const [showGeofences, setShowGeofences] = useState(false);
      const [showProfile, setShowProfile] = useState(false);
      const [showWeather, setShowWeather] = useState(false);
      const [agentInput, setAgentInput] = useState('');
      const [agentMessages, setAgentMessages] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [isDark, setIsDark] = useState(true);
      const [geofences, setGeofences] = useState([]);
      const [currentLocation, setCurrentLocation] = useState(null);
      const [locationPermission, setLocationPermission] = useState('prompt');
      const [activeReminders, setActiveReminders] = useState([]);
      const [weather, setWeather] = useState(null);
      const [weatherAlerts, setWeatherAlerts] = useState([]);
      const [homesteadProfile, setHomesteadProfile] = useState(null);
      const fileInputRef = useRef(null);
      const locationWatchId = useRef(null);

      // Default modules
      const defaultModules = [
        { id: 'garden', name: 'Garden', color: '#4ade80', emoji: '🌱' },
        { id: 'greenhouse', name: 'Greenhouse', color: '#22d3ee', emoji: '🏡' },
        { id: 'orchard', name: 'Fruit & Orchard', color: '#f97316', emoji: '🍎' },
        { id: 'bees', name: 'Beekeeping', color: '#fbbf24', emoji: '🐝' },
        { id: 'livestock', name: 'Sheep & Goats', color: '#f87171', emoji: '🐑' },
        { id: 'birds', name: 'Birds', color: '#fcd34d', emoji: '🐓' },
        { id: 'farmstand', name: 'Farm Stand', color: '#10b981', emoji: '🏪' },
        { id: 'property', name: 'Property', color: '#a78bfa', emoji: '🔧' },
        { id: 'household', name: 'Household', color: '#fb923c', emoji: '🏠' },
      ];

      const defaultGeofences = [
        {
          id: 'farmstand',
          name: 'Farm Stand',
          moduleId: 'farmstand',
          latitude: 0,
          longitude: 0,
          radius: 50,
          emoji: '🏪',
          enabled: true,
          reminders: [
            'Check if anyone bought eggs and grab the cash',
            'Replace any purchased items with fresh stock',
            'Make sure the cash box is secure'
          ]
        }
      ];

      // Initialize
      useEffect(() => {
        loadFromFirebase();
        requestLocationPermission();
        handleURLParameters();
        loadWeather();
      }, []);

      // Fetch weather every hour
      useEffect(() => {
        const interval = setInterval(() => {
          loadWeather();
        }, 60 * 60 * 1000); // Every hour

        return () => clearInterval(interval);
      }, [currentLocation]);

      // Load weather data
      async function loadWeather() {
        if (!currentLocation) return;

        try {
          const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${currentLocation.latitude}&longitude=${currentLocation.longitude}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto`
          );
          
          const data = await response.json();
          setWeather(data);
          
          // Generate smart alerts based on weather
          generateWeatherAlerts(data);
        } catch (e) {
          console.error('Weather fetch failed:', e);
        }
      }

      function generateWeatherAlerts(weatherData) {
        const alerts = [];
        const current = weatherData.current;
        const daily = weatherData.daily;

        // Temperature alerts
        if (current.temperature_2m > 90) {
          alerts.push({
            type: 'warning',
            icon: '🔥',
            title: 'High Heat Alert',
            message: 'Check livestock water levels and greenhouse ventilation',
            priority: 'high'
          });
        }

        if (current.temperature_2m < 32) {
          alerts.push({
            type: 'warning',
            icon: '❄️',
            title: 'Frost Warning',
            message: 'Protect tender plants and check animal water for freezing',
            priority: 'high'
          });
        }

        // Rain alerts
        if (current.precipitation > 0.5) {
          alerts.push({
            type: 'info',
            icon: '🌧️',
            title: 'Heavy Rain',
            message: 'Check for drainage issues and secure equipment',
            priority: 'medium'
          });
        }

        // Wind alerts
        if (current.wind_speed_10m > 25) {
          alerts.push({
            type: 'warning',
            icon: '💨',
            title: 'High Winds',
            message: 'Secure loose items and check building structures',
            priority: 'high'
          });
        }

        // Tomorrow forecast
        if (daily.temperature_2m_min[1] < 32) {
          alerts.push({
            type: 'info',
            icon: '🌡️',
            title: 'Frost Expected Tomorrow',
            message: 'Plan to cover sensitive plants tonight',
            priority: 'medium'
          });
        }

        setWeatherAlerts(alerts);

        // Trigger IFTTT for high priority alerts
        alerts.forEach(alert => {
          if (alert.priority === 'high') {
            triggerIFTTT('weather_alert', {
              v1: alert.title,
              v2: alert.message,
              v3: current.temperature_2m + '°F'
            });
          }
        });
      }

      function getWeatherDescription(code) {
        const descriptions = {
          0: 'Clear sky',
          1: 'Mainly clear',
          2: 'Partly cloudy',
          3: 'Overcast',
          45: 'Foggy',
          48: 'Foggy',
          51: 'Light drizzle',
          53: 'Moderate drizzle',
          55: 'Dense drizzle',
          61: 'Slight rain',
          63: 'Moderate rain',
          65: 'Heavy rain',
          71: 'Slight snow',
          73: 'Moderate snow',
          75: 'Heavy snow',
          80: 'Rain showers',
          81: 'Rain showers',
          82: 'Heavy rain showers',
          95: 'Thunderstorm'
        };
        return descriptions[code] || 'Unknown';
      }

      // Real-time Firebase sync
      useEffect(() => {
        const unsubscribeTasks = db.collection('homesteads').doc('family').collection('tasks')
          .onSnapshot((snapshot) => {
            const tasksData = {};
            snapshot.forEach((doc) => {
              tasksData[doc.id] = doc.data().items || [];
            });
            setTasks(tasksData);
          });

        const unsubscribePhotos = db.collection('homesteads').doc('family').collection('photos')
          .onSnapshot((snapshot) => {
            const photosData = {};
            snapshot.forEach((doc) => {
              photosData[doc.id] = doc.data().items || [];
            });
            setPhotos(photosData);
          });

        const unsubscribeMain = db.collection('homesteads').doc('family')
          .onSnapshot((doc) => {
            if (doc.exists) {
              if (doc.data().geofences) setGeofences(doc.data().geofences);
              if (doc.data().profile) setHomesteadProfile(doc.data().profile);
            }
          });

        return () => {
          unsubscribeTasks();
          unsubscribePhotos();
          unsubscribeMain();
        };
      }, []);

      async function loadFromFirebase() {
        try {
          setIsSyncing(true);
          
          const doc = await db.collection('homesteads').doc('family').get();
          if (doc.exists) {
            const data = doc.data();
            setModules(data.modules || defaultModules);
            setGeofences(data.geofences || defaultGeofences);
            setHomesteadProfile(data.profile || null);
          } else {
            setModules(defaultModules);
            setGeofences(defaultGeofences);
            await db.collection('homesteads').doc('family').set({
              modules: defaultModules,
              geofences: defaultGeofences
            });
          }

        } catch (e) {
          console.error('Load error:', e);
          setModules(defaultModules);
          setGeofences(defaultGeofences);
        } finally {
          setIsSyncing(false);
        }
      }

      async function saveHomesteadProfile(profile) {
        try {
          await db.collection('homesteads').doc('family').set({
            profile: profile
          }, { merge: true });
          
          setHomesteadProfile(profile);
          alert('Homestead profile saved! AI will now give personalized recommendations.');
        } catch (e) {
          console.error('Error saving profile:', e);
          alert('Failed to save profile. Please try again.');
        }
      }

      function handleURLParameters() {
        const params = new URLSearchParams(window.location.search);
        
        if (params.get('module')) {
          setTimeout(() => {
            const module = modules.find(m => m.id === params.get('module'));
            if (module) setSelectedModule(module);
          }, 500);
        }
        
        if (params.get('cmd') === 'add' && params.get('task')) {
          setTimeout(() => {
            const moduleId = params.get('module') || 'household';
            addTask(moduleId, decodeURIComponent(params.get('task')));
          }, 500);
        }
        
        if (params.get('action') === 'assistant') {
          setShowAgent(true);
        }
      }

      async function requestLocationPermission() {
        if (!navigator.geolocation) return;

        if ('Notification' in window && Notification.permission === 'default') {
          await Notification.requestPermission();
        }

        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject);
          });
          
          setLocationPermission('granted');
          const newLocation = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };
          setCurrentLocation(newLocation);
          
          startLocationTracking();
          loadWeather(); // Load weather once we have location
        } catch (error) {
          setLocationPermission('denied');
        }
      }

      function startLocationTracking() {
        if (locationWatchId.current) return;
        
        locationWatchId.current = navigator.geolocation.watchPosition(
          (position) => {
            const newLocation = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude
            };
            setCurrentLocation(newLocation);
            checkGeofences(newLocation);
          },
          (error) => console.log('Location error:', error),
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
        );
      }

      function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
      }

      function checkGeofences(location) {
        geofences.forEach(geofence => {
          if (!geofence.enabled || geofence.latitude === 0) return;
          
          const distance = calculateDistance(
            location.latitude,
            location.longitude,
            geofence.latitude,
            geofence.longitude
          );

          if (distance <= geofence.radius) {
            const lastReminder = localStorage.getItem(`geofence-${geofence.id}-last`);
            const now = Date.now();
            const cooldown = 30 * 60 * 1000;
            
            if (!lastReminder || (now - parseInt(lastReminder)) > cooldown) {
              triggerGeofenceReminder(geofence);
              localStorage.setItem(`geofence-${geofence.id}-last`, now.toString());
            }
          }
        });
      }

      function triggerGeofenceReminder(geofence) {
        const moduleTasks = tasks[geofence.moduleId] || [];
        const pendingTasks = moduleTasks.filter(t => !t.completed);
        
        const reminders = [
          ...geofence.reminders,
          ...pendingTasks.slice(0, 3).map(t => `Task: ${t.text}`)
        ];

        // Add weather context to reminders
        if (weather && weatherAlerts.length > 0) {
          reminders.push(`Weather: ${weatherAlerts[0].message}`);
        }

        if ('Notification' in window && Notification.permission === 'granted') {
          const notification = new Notification(`${geofence.emoji} You're near ${geofence.name}!`, {
            body: reminders[0],
            tag: `geofence-${geofence.id}`
          });

          notification.onclick = () => {
            window.focus();
            const module = modules.find(m => m.id === geofence.moduleId);
            if (module) setSelectedModule(module);
            setActiveReminders(reminders);
          };
        }

        setActiveReminders(reminders);
        
        // Trigger IFTTT
        triggerIFTTT('geofence_entered', {
          v1: geofence.name,
          v2: reminders[0],
          v3: new Date().toISOString()
        });
      }

      async function triggerIFTTT(eventName, values = {}) {
        if (IFTTT_WEBHOOK_KEY === 'YOUR_IFTTT_KEY_HERE') {
          console.log('IFTTT not configured');
          return;
        }

        try {
          await fetch(`https://maker.ifttt.com/trigger/${eventName}/with/key/${IFTTT_WEBHOOK_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              value1: values.v1 || '',
              value2: values.v2 || '',
              value3: values.v3 || ''
            })
          });
        } catch (e) {
          console.log('IFTTT trigger failed:', e);
        }
      }

      async function addTask(moduleId, taskText) {
        const newTask = {
          id: Date.now(),
          text: taskText,
          completed: false,
          created: new Date().toISOString(),
          completedDate: null
        };

        const moduleTasks = tasks[moduleId] || [];
        const updatedTasks = [...moduleTasks, newTask];

        try {
          await db.collection('homesteads').doc('family').collection('tasks').doc(moduleId).set({
            items: updatedTasks
          });
          
          // Trigger IFTTT
          triggerIFTTT('task_added', {
            v1: taskText,
            v2: moduleId,
            v3: new Date().toISOString()
          });
        } catch (e) {
          console.error('Error adding task:', e);
        }
      }

      async function toggleTask(moduleId, taskId) {
        const moduleTasks = tasks[moduleId] || [];
        const task = moduleTasks.find(t => t.id === taskId);
        const updatedTasks = moduleTasks.map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              completed: !t.completed,
              completedDate: !t.completed ? new Date().toISOString() : null
            };
          }
          return t;
        });

        try {
          await db.collection('homesteads').doc('family').collection('tasks').doc(moduleId).set({
            items: updatedTasks
          });
          
          // Trigger IFTTT on completion
          if (task && !task.completed) {
            triggerIFTTT('task_completed', {
              v1: task.text,
              v2: moduleId,
              v3: new Date().toISOString()
            });
          }
        } catch (e) {
          console.error('Error toggling task:', e);
        }
      }

      async function deleteTask(moduleId, taskId) {
        const moduleTasks = tasks[moduleId] || [];
        const updatedTasks = moduleTasks.filter(t => t.id !== taskId);

        try {
          await db.collection('homesteads').doc('family').collection('tasks').doc(moduleId).set({
            items: updatedTasks
          });
        } catch (e) {
          console.error('Error deleting task:', e);
        }
      }

      async function addPhoto(moduleId, file) {
        const reader = new FileReader();
        reader.onload = async (e) => {
          const photoData = {
            id: Date.now(),
            data: e.target.result,
            date: new Date().toISOString(),
            moduleId,
            analyzed: false
          };
          
          const modulePhotos = photos[moduleId] || [];
          const updatedPhotos = [...modulePhotos, photoData];

          try {
            await db.collection('homesteads').doc('family').collection('photos').doc(moduleId).set({
              items: updatedPhotos
            });
            analyzePhotoWithAI(photoData, moduleId);
          } catch (e) {
            console.error('Error adding photo:', e);
          }
        };
        reader.readAsDataURL(file);
      }

      async function analyzePhotoWithAI(photo, moduleId) {
        setIsLoading(true);
        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 1000,
              messages: [{
                role: 'user',
                content: [
                  {
                    type: 'image',
                    source: {
                      type: 'base64',
                      media_type: 'image/jpeg',
                      data: photo.data.split(',')[1]
                    }
                  },
                  {
                    type: 'text',
                    text: `Analyze this ${moduleId} image. Provide: 1. What you see 2. Health assessment 3. Issues 4. Recommendations 5. Best practices. Be specific.`
                  }
                ]
              }]
            })
          });

          const data = await response.json();
          const analysis = data.content[0].text;
          
          const modulePhotos = photos[moduleId] || [];
          const updatedPhotos = modulePhotos.map(p => {
            if (p.id === photo.id) {
              return { ...p, analysis, analyzed: true };
            }
            return p;
          });

          await db.collection('homesteads').doc('family').collection('photos').doc(moduleId).set({
            items: updatedPhotos
          });
          
          setAgentMessages(prev => [...prev, {
            role: 'assistant',
            content: `📸 Photo Analysis:\n\n${analysis}`
          }]);
          
          // Trigger IFTTT
          triggerIFTTT('photo_analyzed', {
            v1: moduleId,
            v2: 'Analysis complete',
            v3: new Date().toISOString()
          });
          
        } catch (e) {
          console.log('Photo analysis failed', e);
        }
        setIsLoading(false);
      }

      async function sendToAgent(message) {
        setIsLoading(true);
        const newMessages = [...agentMessages, { role: 'user', content: message }];
        setAgentMessages(newMessages);
        setAgentInput('');

        // Build context with weather and profile
        let systemContext = `You are an expert homestead management AI assistant. Help with sustainable agriculture, animal husbandry, beekeeping, orchards, greenhouses, farm stands, and more. Be practical and actionable.`;

        if (homesteadProfile) {
          systemContext += `\n\nHomestead Profile:
- Location: ${homesteadProfile.location || 'Not specified'}
- USDA Zone: ${homesteadProfile.zone || 'Not specified'}
- Property Size: ${homesteadProfile.size || 'Not specified'}
- Animals: ${homesteadProfile.animals || 'Not specified'}
- Crops: ${homesteadProfile.crops || 'Not specified'}
- Goals: ${homesteadProfile.goals || 'Not specified'}`;
        }

        if (weather) {
          const current = weather.current;
          systemContext += `\n\nCurrent Weather:
- Temperature: ${current.temperature_2m}°F
- Conditions: ${getWeatherDescription(current.weather_code)}
- Humidity: ${current.relative_humidity_2m}%
- Wind: ${current.wind_speed_10m} mph`;
          
          if (weatherAlerts.length > 0) {
            systemContext += `\n- Active Alerts: ${weatherAlerts.map(a => a.title).join(', ')}`;
          }
        }

        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 2000,
              messages: newMessages,
              system: systemContext
            })
          });

          const data = await response.json();
          const assistantMessage = data.content[0].text;
          
          setAgentMessages([...newMessages, { role: 'assistant', content: assistantMessage }]);
        } catch (e) {
          setAgentMessages([...newMessages, { 
            role: 'assistant', 
            content: 'Sorry, I had trouble connecting.' 
          }]);
        }
        
        setIsLoading(false);
      }

      async function setCurrentLocationAsGeofence(moduleId) {
        if (!currentLocation) {
          alert('Please enable location access first');
          return;
        }

        const module = modules.find(m => m.id === moduleId);
        const newGeofence = {
          id: `custom-${Date.now()}`,
          name: `${module.name} Location`,
          moduleId: moduleId,
          latitude: currentLocation.latitude,
          longitude: currentLocation.longitude,
          radius: 50,
          emoji: module.emoji,
          enabled: true,
          reminders: ['Check pending tasks while you\'re here']
        };

        const updatedGeofences = [...geofences, newGeofence];
        
        try {
          await db.collection('homesteads').doc('family').set({
            geofences: updatedGeofences
          }, { merge: true });
          
          alert(`Geofence created at current location for ${module.name}!`);
        } catch (e) {
          console.error('Error saving geofence:', e);
        }
      }

      useEffect(() => {
        return () => {
          if (locationWatchId.current) {
            navigator.geolocation.clearWatch(locationWatchId.current);
          }
        };
      }, []);

      // Render

        navigator.serviceWorker.register('/sw.js')
          .then(registration => console.log('SW registered'))
          .catch(err => console.log('SW registration failed'));
      });
    }
  </script>
