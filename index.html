<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homestead Helper Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap');
    :root { --cream: #FFF8E7; --peach: #FFB4A2; --brown: #8B6F47; --mint: #B5E7D3; }
    body { font-family: 'Josefin Sans', sans-serif; background: var(--cream); margin: 0; }
    .chat-container { height: 100vh; display: flex; flex-direction: column; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 12px; }
    .message-bubble { border: 2.5px solid var(--brown); border-radius: 18px; padding: 12px; max-width: 85%; }
    .user { align-self: flex-end; background: var(--mint); }
    .assistant { align-self: flex-start; background: white; }
    .status-bar { font-size: 10px; padding: 2px 8px; background: rgba(0,0,0,0.05); display: flex; gap: 10px; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex; height:100vh; align-items:center; justify-content:center; color:var(--brown)">
      Checking Homestead Systems...
    </div>
  </div>

  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const firebaseConfig = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    // Initialize Firebase
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState('Wait...');
      const scrollRef = useRef(null);

      useEffect(() => {
        const unsub = db.collection('messages').orderBy('timestamp', 'asc').limit(50)
          .onSnapshot(s => {
            setMessages(s.docs.map(d => d.data()));
            setStatus('Online');
          }, err => setStatus('DB Error: ' + err.message));
        return () => unsub();
      }, []);

      useEffect(() => { scrollRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const send = async () => {
        if (!input.trim() || loading) return;
        setLoading(true);
        const userText = input;
        setInput('');

        try {
          const genAI = new GoogleGenerativeAI(firebaseConfig.apiKey);
          const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

          await db.collection('messages').add({ role: 'user', content: userText, timestamp: Date.now() });

          const result = await model.generateContent(userText);
          const aiText = result.response.text();

          await db.collection('messages').add({ role: 'assistant', content: aiText, timestamp: Date.now() });
        } catch (e) {
          setStatus('AI Error: ' + e.message);
        } finally {
          setLoading(false);
        }
      };

      return h('div', { className: 'chat-container' },
        h('header', { className: 'p-4 bg-orange-200 border-b-4 border-amber-900 text-center' },
          h('h1', { className: 'text-xl font-bold text-amber-900' }, '🏡 Homestead Helper'),
          h('div', { className: 'status-bar' }, 'System: ' + status)
        ),
        h('div', { className: 'messages-container' },
          messages.map((m, i) => h('div', { key: i, className: `message-bubble ${m.role}` }, m.content)),
          loading && h('div', { className: 'assistant message-bubble' }, '...'),
          h('div', { ref: scrollRef })
        ),
        h('div', { className: 'p-4 bg-white border-t-2 border-amber-900 flex gap-2' },
          h('input', {
            value: input, onChange: e => setInput(e.target.value),
            onKeyPress: e => e.key === 'Enter' && send(),
            className: 'flex-1 p-2 border-2 border-amber-100 rounded-xl outline-none',
            placeholder: 'Type here...'
          }),
          h('button', { onClick: send, className: 'bg-amber-800 text-white px-4 py-2 rounded-xl' }, 'Send')
        )
      );
    }

    // React 18 Render logic
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>
