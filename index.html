<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homestead">
  <meta name="theme-color" content="#FFB4A2">
  <title>Homestead Helper Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Josefin+Sans:wght@300;400;600;700&display=swap');
    :root {
      --folk-cream: #FFF8E7; --folk-peach: #FFB4A2; --folk-coral: #E5989B;
      --folk-terracotta: #D68A7F; --folk-mint: #B5E7D3; --folk-sage: #8FB996;
      --folk-lavender: #C9B8E4; --folk-butter: #FFE5B4; --folk-brown: #8B6F47;
      --folk-navy: #4A5568; --folk-burgundy: #9B5D6B; --folk-sky: #A8DADC;
    }
    body { font-family: 'Josefin Sans', sans-serif; background: var(--folk-cream); overscroll-behavior-y: contain; }
    .chat-container { height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, var(--folk-cream) 0%, var(--folk-butter) 50%, var(--folk-cream) 100%); }
    .messages-container { flex: 1; overflow-y: auto; padding: 1.5rem; }
    .folk-card { border: 3px solid var(--folk-brown); border-radius: 16px; box-shadow: 5px 5px 0 rgba(139, 111, 71, 0.25); }
    .message-bubble { border: 2.5px solid; border-radius: 20px; padding: 12px; margin-bottom: 12px; max-width: 85%; }
    .user { align-self: flex-end; background: var(--folk-mint); border-color: var(--folk-sage); margin-left: auto; }
    .assistant { align-self: flex-start; background: white; border-color: var(--folk-peach); }
    .slide-panel { position: fixed; top: 0; right: -100%; width: 100%; height: 100vh; transition: right 0.4s ease; z-index: 100; background: var(--folk-cream); border-left: 4px solid var(--folk-brown); }
    .slide-panel.open { right: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Configuration from your original file
    const firebaseConfig = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function HomesteadHelperPro() {
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [showOrganized, setShowOrganized] = useState(false);
      const messagesEndRef = useRef(null);

      // Effect to load messages from Firestore
      useEffect(() => {
        const unsubscribe = db.collection('homesteads').doc('family').collection('messages')
          .orderBy('timestamp', 'asc')
          .onSnapshot(snap => {
            setMessages(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
        return () => unsubscribe();
      }, []);

      useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const sendMessage = async () => {
        if (!inputText.trim()) return;
        const msg = { role: 'user', content: inputText, timestamp: Date.now() };
        setInputText('');
        await db.collection('homesteads').doc('family').collection('messages').add(msg);
        
        // Simple mock response to confirm it's working
        setTimeout(() => {
          db.collection('homesteads').doc('family').collection('messages').add({
            role: 'assistant', content: "I'm on it! I've logged that for the homestead.", timestamp: Date.now()
          });
        }, 1000);
      };

      return h('div', { className: 'chat-container' },
        // Header
        h('header', { className: 'p-4 border-b-4 border-amber-900 bg-orange-200' },
          h('div', { className: 'flex justify-between items-center max-w-4xl mx-auto' },
            h('h1', { className: 'text-2xl font-bold text-amber-900' }, '🏡 Homestead Helper'),
            h('button', { 
              onClick: () => setShowOrganized(true),
              className: 'p-2 bg-white border-2 border-amber-900 rounded-lg' 
            }, '📋 Tasks')
          )
        ),

        // Messages
        h('div', { className: 'messages-container flex flex-col' },
          messages.map((m, i) => h('div', { 
            key: i, 
            className: `message-bubble ${m.role}` 
          }, m.content)),
          h('div', { ref: messagesEndRef })
        ),

        // Input Bar
        h('div', { className: 'p-4 bg-white border-t-2 border-amber-900' },
          h('div', { className: 'flex gap-2 max-w-4xl mx-auto' },
            h('input', {
              value: inputText,
              onChange: (e) => setInputText(e.target.value),
              onKeyPress: (e) => e.key === 'Enter' && sendMessage(),
              placeholder: 'Type a message...',
              className: 'flex-1 p-3 border-2 border-amber-200 rounded-xl focus:outline-none focus:border-amber-500'
            }),
            h('button', { 
              onClick: sendMessage,
              className: 'px-6 py-2 bg-amber-800 text-white rounded-xl font-bold'
            }, 'Send')
          )
        ),

        // Task Panel
        h('div', { className: `slide-panel ${showOrganized ? 'open' : ''}` },
          h('div', { className: 'p-6' },
            h('div', { className: 'flex justify-between items-center mb-6' },
              h('h2', { className: 'text-2xl font-bold' }, 'Homestead Tasks'),
              h('button', { onClick: () => setShowOrganized(false), className: 'text-2xl' }, '✕')
            ),
            h('p', { className: 'text-gray-600' }, 'Your active tasks will appear here as the AI extracts them from your chat.')
          )
        )
      );
    }

    // React 18 Rendering Logic
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(HomesteadHelperPro));
  </script>
</body>
</html>
