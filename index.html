<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homestead Helper Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Josefin Sans', sans-serif; background: #FFF8E7; margin: 0; }
    .chat-container { height: 100vh; display: flex; flex-direction: column; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 12px; }
    .message-bubble { border: 2.5px solid #8B6F47; border-radius: 18px; padding: 12px; max-width: 85%; line-height: 1.4; }
    .user { align-self: flex-end; background: #B5E7D3; box-shadow: 4px 4px 0 rgba(0,0,0,0.05); }
    .assistant { align-self: flex-start; background: white; box-shadow: -4px 4px 0 rgba(0,0,0,0.05); }
    .status-text { font-size: 10px; color: #8B6F47; text-transform: uppercase; font-weight: bold; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const firebaseConfig = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function HomesteadApp() {
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState('Checking Connection...');
      const scrollRef = useRef(null);

      useEffect(() => {
        const unsub = db.collection('messages').orderBy('timestamp', 'asc').limit(50)
          .onSnapshot(snap => {
            setMessages(snap.docs.map(doc => doc.data()));
            setStatus('Systems Online');
          }, err => setStatus('DB Error: ' + err.message));
        return () => unsub();
      }, []);

      useEffect(() => { scrollRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const sendMessage = async () => {
        if (!inputText.trim() || loading) return;
        setLoading(true);
        const userPrompt = inputText;
        setInputText('');

        try {
          const genAI = new GoogleGenerativeAI(firebaseConfig.apiKey);
          const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

          await db.collection('messages').add({ role: 'user', content: userPrompt, timestamp: Date.now() });

          const result = await model.generateContent(userPrompt);
          const text = result.response.text();

          await db.collection('messages').add({ role: 'assistant', content: text, timestamp: Date.now() });
        } catch (error) {
          console.error(error);
          setStatus('AI Error: ' + error.message);
        } finally {
          setLoading(false);
        }
      };

      return h('div', { className: 'chat-container' },
        h('header', { className: 'p-4 bg-orange-200 border-b-4 border-amber-900 flex justify-between items-center' },
          h('h1', { className: 'text-xl font-bold text-amber-900' }, '🏡 Homestead Helper'),
          h('span', { className: 'status-text' }, status)
        ),
        h('div', { className: 'messages-container' },
          messages.map((m, i) => h('div', { key: i, className: `message-bubble ${m.role}` }, m.content)),
          loading && h('div', { className: 'assistant message-bubble' }, 'Thinking...'),
          h('div', { ref: scrollRef })
        ),
        h('div', { className: 'p-4 bg-white border-t-2 border-amber-900 flex gap-2' },
          h('input', {
            value: inputText,
            onChange: e => setInputText(e.target.value),
            onKeyPress: e => e.key === 'Enter' && sendMessage(),
            className: 'flex-1 p-3 border-2 border-amber-100 rounded-xl outline-none focus:border-amber-400',
            placeholder: 'How is Ruth doing?'
          }),
          h('button', { 
            onClick: sendMessage, 
            className: 'bg-amber-800 text-white px-6 py-2 rounded-xl font-bold' 
          }, 'Send')
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(HomesteadApp));
  </script>
</body>
</html>
