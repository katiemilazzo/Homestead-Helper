<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homestead Helper Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Josefin Sans', sans-serif; background: #FFF8E7; margin: 0; }
    .chat-container { height: 100vh; display: flex; flex-direction: column; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 10px; }
    .bubble { border: 2px solid #8B6F47; border-radius: 15px; padding: 12px; max-width: 85%; }
    .user { align-self: flex-end; background: #B5E7D3; }
    .assistant { align-self: flex-start; background: white; }
    .status-bar { font-size: 10px; text-align: center; padding: 4px; background: rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    const config = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    firebase.initializeApp(config);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [status, setStatus] = useState('Initializing...');
      const scrollRef = useRef(null);

      useEffect(() => {
        const unsub = db.collection('messages').orderBy('timestamp', 'asc').limit(50)
          .onSnapshot(snap => {
            setMessages(snap.docs.map(doc => doc.data()));
            setStatus('Systems Online');
          }, err => setStatus('Connection Error: ' + err.message));
        return () => unsub();
      }, []);

      useEffect(() => { scrollRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const send = async () => {
        if (!input.trim()) return;
        const prompt = input;
        setInput('');
        try {
          // 1. Log user message
          await db.collection('messages').add({ role: 'user', content: prompt, timestamp: Date.now() });
          
          // 2. Call Gemini API
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${config.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);

          // 3. Log AI response
          await db.collection('messages').add({ role: 'assistant', content: data.candidates[0].content.parts[0].text, timestamp: Date.now() });
        } catch (e) {
          setStatus('AI Error: ' + e.message);
        }
      };

      return h('div', { className: 'chat-container' },
        h('header', { className: 'p-4 bg-orange-200 border-b-4 border-amber-900 font-bold text-center' }, '🏡 Homestead Helper Pro'),
        h('div', { className: 'status-bar' }, status),
        h('div', { className: 'messages-container' },
          messages.map((m, i) => h('div', { key: i, className: `bubble ${m.role}` }, m.content)),
          h('div', { ref: scrollRef })
        ),
        h('div', { className: 'p-4 bg-white border-t-2 border-amber-900 flex gap-2' },
          h('input', { value: input, onChange: e => setInput(e.target.value), onKeyPress: e => e.key === 'Enter' && send(), className: 'flex-1 p-2 border rounded', placeholder: 'Message...' }),
          h('button', { onClick: send, className: 'bg-amber-800 text-white px-4 py-2 rounded font-bold' }, 'Send')
        )
      );
    }

    // React 18 Mounting
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>
