<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Homestead Helper Pro" />
  <meta name="theme-color" content="#FFB4A2" />
  <title>Homestead Helper Pro</title>

  <link rel="manifest" href="manifest.json" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React (NO Babel, NO JSX) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body {
      background: #FFF8E7;
      font-family: 'Josefin Sans', sans-serif;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    const h = React.createElement;

    async function callGemini(prompt) {
      try {
        const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=YOUR_API_KEY", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const json = await res.json();

        // 🔍 FULL RAW LOG
        console.group("🌾 Gemini Raw Response");
        console.log(json);
        console.groupEnd();

        // 🛡️ RESPONSE GUARD
        const text =
          json?.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!text) {
          console.warn("⚠️ Gemini returned no usable text");
          return "Sorry, I had trouble connecting. Please try again in a moment.";
        }

        return text;
      } catch (err) {
        console.error("🔥 Gemini call failed:", err);
        return "Sorry, I had trouble connecting. Please try again in a moment.";
      }
    }

    function App() {
      const [messages, setMessages] = React.useState([]);
      const [input, setInput] = React.useState("");
      const [loading, setLoading] = React.useState(false);

      async function send() {
        if (!input.trim()) return;

        const userMsg = { role: "user", text: input };
        setMessages(m => [...m, userMsg]);
        setInput("");
        setLoading(true);

        const reply = await callGemini(input);

        setMessages(m => [...m, { role: "ai", text: reply }]);
        setLoading(false);
      }

      return h("div", { className: "max-w-3xl mx-auto p-4" },
        h("h1", { className: "text-2xl font-bold mb-4" }, "🏡 Homestead Helper Pro"),

        h("div", { className: "space-y-3 mb-4" },
          messages.map((m, i) =>
            h("div", {
              key: i,
              className: m.role === "user" ? "text-right" : "text-left"
            },
              h("div", {
                className: "inline-block px-4 py-2 rounded-xl",
                style: {
                  background: m.role === "user" ? "#FFB4A2" : "#FFF",
                  border: "2px solid #8B6F47"
                }
              }, m.text)
            )
          ),
          loading && h("div", { className: "italic text-sm" }, "Thinking…")
        ),

        h("div", { className: "flex gap-2" },
          h("input", {
            className: "flex-1 p-2 border rounded",
            value: input,
            onChange: e => setInput(e.target.value),
            onKeyDown: e => e.key === "Enter" && send()
          }),
          h("button", {
            onClick: send,
            className: "px-4 py-2 rounded",
            style: { background: "#8FB996", border: "2px solid #8B6F47" }
          }, "Send")
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      h(App)
    );
  </script>
</body>
</html>
