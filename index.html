<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homestead Helper Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap');
    :root { --cream: #FFF8E7; --brown: #8B6F47; --mint: #B5E7D3; }
    body { font-family: 'Josefin Sans', sans-serif; background: var(--cream); margin: 0; }
    .chat-container { height: 100vh; display: flex; flex-direction: column; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 12px; }
    .bubble { border: 2.5px solid var(--brown); border-radius: 18px; padding: 12px; max-width: 85%; }
    .user { align-self: flex-end; background: var(--mint); }
    .assistant { align-self: flex-start; background: white; }
    .error-box { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 11px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
      authDomain: "homestead-helper-fdc23.firebaseapp.com",
      projectId: "homestead-helper-fdc23",
      storageBucket: "homestead-helper-fdc23.firebasestorage.app",
      messagingSenderId: "704725515036",
      appId: "1:704725515036:web:4dd3427e51afe507b018d9"
    };

    // Initialize Firebase
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const { useState, useEffect, useRef, createElement: h } = React;

    function HomesteadApp() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const scrollRef = useRef(null);

      // Listen to Firestore
      useEffect(() => {
        const unsub = db.collection('homesteads').doc('family').collection('messages')
          .orderBy('timestamp', 'asc').limit(50)
          .onSnapshot(snap => {
            setMessages(snap.docs.map(doc => doc.data()));
          }, err => setError("Database Error: " + err.message));
        return () => unsub();
      }, []);

      useEffect(() => { scrollRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const sendMessage = async () => {
        if (!input.trim() || loading) return;
        const userText = input;
        setInput('');
        setLoading(true);
        setError(null);

        try {
          // 1. Save User Message
          await db.collection('homesteads').doc('family').collection('messages').add({
            role: 'user', content: userText, timestamp: Date.now()
          });

          // 2. Call Gemini API (Using THE CORRECT unified Key)
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${firebaseConfig.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `You are a Homestead AI for Airville, PA. You know Ruth (sheep), chickens, ducks, and peafowl. User says: ${userText}` }] }]
            })
          });

          const data = await response.json();
          
          if (data.error) {
            throw new Error(data.error.message);
          }

          const aiText = data.candidates[0].content.parts[0].text;

          // 3. Save AI Response
          await db.collection('homesteads').doc('family').collection('messages').add({
            role: 'assistant', content: aiText, timestamp: Date.now()
          });
        } catch (e) {
          setError("AI Error: " + e.message);
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      return h('div', { className: 'chat-container' },
        h('header', { className: 'p-4 bg-orange-200 border-b-4 border-amber-900 text-center font-bold text-amber-900' }, '🏡 Homestead Helper Pro'),
        h('div', { className: 'messages-container' },
          error && h('div', { className: 'error-box' }, error),
          messages.map((m, i) => h('div', { key: i, className: `bubble ${m.role}` }, m.content)),
          loading && h('div', { className: 'assistant bubble' }, 'Thinking...'),
          h('div', { ref: scrollRef })
        ),
        h('div', { className: 'p-4 bg-white border-t-2 border-amber-900 flex gap-2' },
          h('input', {
            value: input, onChange: e => setInput(e.target.value),
            onKeyPress: e => e.key === 'Enter' && sendMessage(),
            className: 'flex-1 p-2 border-2 border-amber-100 rounded-xl outline-none focus:border-amber-400',
            placeholder: 'Ask about Ruth...'
          }),
          h('button', { onClick: sendMessage, className: 'bg-amber-800 text-white px-6 py-2 rounded-xl font-bold' }, 'Send')
        )
      );
    }

    // Correct React 18 Rendering
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(HomesteadApp));
  </script>
</body>
</html>
