<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homestead Helper Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";
    window.GoogleGenerativeAI = GoogleGenerativeAI;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Josefin Sans', sans-serif; background: #FFF8E7; margin: 0; }
    .chat-container { height: 100vh; display: flex; flex-direction: column; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 12px; }
    .message-bubble { border: 2.5px solid #8B6F47; border-radius: 18px; padding: 12px; max-width: 85%; }
    .user { align-self: flex-end; background: #B5E7D3; }
    .assistant { align-self: flex-start; background: white; }
    .loading-dot { display: inline-block; width: 8px; height: 8px; background: #8B6F47; border-radius: 50%; margin: 0 2px; animation: bounce 0.6s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/javascript">
    // We wrap everything in a check to ensure dependencies are loaded
    const initApp = () => {
      const firebaseConfig = {
        apiKey: "AIzaSyDSR3019LmFBUSLUfr3xCNW67WpXKc9edQ",
        authDomain: "homestead-helper-fdc23.firebaseapp.com",
        projectId: "homestead-helper-fdc23",
        storageBucket: "homestead-helper-fdc23.firebasestorage.app",
        messagingSenderId: "704725515036",
        appId: "1:704725515036:web:4dd3427e51afe507b018d9"
      };

      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      
      const { useState, useEffect, useRef, createElement: h } = React;

      function HomesteadHelperPro() {
        const [messages, setMessages] = useState([]);
        const [inputText, setInputText] = useState('');
        const [loading, setLoading] = useState(false);
        const [status, setStatus] = useState('Connecting...');
        const messagesEndRef = useRef(null);

        useEffect(() => {
          const unsubscribe = db.collection('homesteads').doc('family').collection('messages')
            .orderBy('timestamp', 'asc').limit(50)
            .onSnapshot(
              snap => {
                setMessages(snap.docs.map(doc => doc.data()));
                setStatus('Online');
              },
              err => {
                console.error("Firestore Error:", err);
                setStatus('Database Error - Check Permissions');
              }
            );
          return () => unsubscribe();
        }, []);

        useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

        const sendMessage = async () => {
          if (!inputText.trim() || loading || !window.GoogleGenerativeAI) return;
          
          const userPrompt = inputText;
          setInputText('');
          setLoading(true);

          try {
            const genAI = new window.GoogleGenerativeAI(firebaseConfig.apiKey);
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

            // 1. Save User Msg
            await db.collection('homesteads').doc('family').collection('messages').add({
              role: 'user', content: userPrompt, timestamp: Date.now()
            });

            // 2. AI Call
            const result = await model.generateContent(userPrompt);
            const responseText = result.response.text();

            // 3. Save AI Response
            await db.collection('homesteads').doc('family').collection('messages').add({
              role: 'assistant', content: responseText, timestamp: Date.now()
            });
          } catch (error) {
            console.error("AI Error:", error);
            alert("AI Error: " + error.message);
          } finally {
            setLoading(false);
          }
        };

        return h('div', { className: 'chat-container' },
          h('header', { className: 'p-4 bg-orange-200 border-b-4 border-amber-900 text-center' }, 
            h('h1', { className: 'text-xl font-bold text-amber-900' }, '🏡 Homestead Helper'),
            h('div', { className: 'text-[10px] uppercase font-bold text-amber-800' }, status)
          ),
          h('div', { className: 'messages-container' },
            messages.map((m, i) => h('div', { key: i, className: `message-bubble ${m.role}` }, m.content)),
            loading && h('div', { className: 'assistant message-bubble' }, h('span', { className: 'loading-dot' })),
            h('div', { ref: messagesEndRef })
          ),
          h('div', { className: 'p-4 border-t-2 border-amber-900 bg-white flex gap-2' },
            h('input', {
              value: inputText,
              onChange: (e) => setInputText(e.target.value),
              onKeyPress: (e) => e.key === 'Enter' && sendMessage(),
              className: 'flex-1 p-3 border-2 border-amber-100 rounded-xl outline-none',
              placeholder: 'Type here...'
            }),
            h('button', { onClick: sendMessage, className: 'bg-amber-800 text-white px-6 py-2 rounded-xl' }, 'Send')
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(h(HomesteadHelperPro));
    };

    // Wait for modules to load before starting
    setTimeout(initApp, 1000);
  </script>
</body>
</html>
